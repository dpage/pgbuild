name: Build libiconv (Windows)

on:
  workflow_dispatch:
  workflow_call:
    
# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-libiconv:
    runs-on: windows-latest
    needs: get-versions    
    defaults:
      run:
        shell: msys2 {0}

    env:
      LIBICONV_VERSION: ${{needs.get-versions.outputs.LIBICONV_VERSION}}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc automake autoconf pkg-config make zip patch tar
      
      - name: Download
        run: |
          # ftp.gnu.org is intermittently unroutable from the runners, so fall
          # back to a mirror rather than failing the entire build.
          for host in https://ftp.gnu.org/pub/gnu https://mirrors.kernel.org/gnu; do
            curl -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              $host/libiconv/libiconv-${{ env.LIBICONV_VERSION }}.tar.gz \
              -o ./libiconv-${{ env.LIBICONV_VERSION }}.tar.gz && break
          done
          tar zxvf libiconv-${{ env.LIBICONV_VERSION }}.tar.gz
      - name: Configure
        run: |
          cd libiconv-${{ env.LIBICONV_VERSION }}
          ./configure --prefix=$(pwd)/winpgbuild \
            --disable-static \
            --disable-dependency-tracking \
            --disable-rpath \
            --disable-nls

      - name: Build
        run: |
          cd libiconv-${{ env.LIBICONV_VERSION }}
          make all

      - name: Install
        run: |
          cd libiconv-${{ env.LIBICONV_VERSION }}
          make install

          cp winpgbuild/lib/libiconv.dll.a winpgbuild/lib/iconv.lib
          cp winpgbuild/lib/libcharset.dll.a winpgbuild/lib/charset.lib

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: libiconv
          install-dir: libiconv-${{ env.LIBICONV_VERSION }}/winpgbuild

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: libiconv-${{ env.LIBICONV_VERSION }}-src
          path: libiconv-${{ env.LIBICONV_VERSION }}.tar.gz

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: libiconv-${{ env.LIBICONV_VERSION }}-windows-x86_64
          path: libiconv-${{ env.LIBICONV_VERSION }}/winpgbuild

      - name: Package Release Assets
        run: |
          cd libiconv-${{ env.LIBICONV_VERSION }}
          mv winpgbuild libiconv
          zip -r libiconv-windows-x86_64-latest.zip libiconv
          
      - name: Publish Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: libiconv-${{ env.LIBICONV_VERSION }}/libiconv-windows-x86_64-latest.zip
          tag: libiconv-windows-x86_64-latest
          title: "libiconv (Windows x86_64)"
          version: ${{ env.LIBICONV_VERSION }}
          immutable-tag: libiconv-${{ env.LIBICONV_VERSION }}-windows-x86_64
          immutable-title: "libiconv ${{ env.LIBICONV_VERSION }} (Windows x86_64)"
