name: Build KRB5 (macOS)

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  PGBUILD_PREFIX: /opt/pgbuild

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-krb5:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      KRB5_VERSION: ${{ needs.get-versions.outputs.KRB5_VERSION }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://kerberos.org/dist/krb5/1.22/krb5-${KRB5_VERSION}.tar.gz" \
              -o "krb5-${KRB5_VERSION}.tar.gz"
          tar zxf "krb5-${KRB5_VERSION}.tar.gz"

      - name: Configure
        run: |
          cd "krb5-${KRB5_VERSION}/src"
          ./configure --prefix="${PGBUILD_PREFIX}/krb5"

      - name: Build
        run: |
          cd "krb5-${KRB5_VERSION}/src"
          make -j4 all

      # Upstream's `make check` is deliberately not run. It was already skipped
      # by the Jenkins jobs this workflow replaces, because large parts of the
      # krb5 test suite stand up a KDC and talk to it over the loopback
      # interface with fixed ports and a writable /etc, which neither the old
      # build farm nor an ephemeral GitHub runner provides. We only consume
      # libgssapi_krb5 and libkrb5 for libpq's GSSAPI support, which the
      # PostgreSQL build exercises in turn, so the cost of getting the full
      # suite running has never been worth it. Keeping it skipped, and saying
      # so here, is better than pretending the coverage exists.

      - name: Install
        run: |
          cd "krb5-${KRB5_VERSION}/src"
          make install

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: krb5
          install-dir: ${{ env.PGBUILD_PREFIX }}/krb5

      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/krb5-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" krb5

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: krb5-${{ env.KRB5_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/krb5-macos-${{ matrix.arch }}-latest.tar.gz

      # Publishing is done with the gh CLI and a retry loop rather than with
      # softprops/action-gh-release, because GitHub applies a secondary rate
      # limit to release and tag creation that several matrix jobs finishing at
      # once will trip. It surfaces as a bare 403 on the create call, with
      # nothing in the response identifying it as a rate limit, and the action
      # reads that as a permissions failure and refuses to retry, which turns a
      # few seconds of back-off into a failed build. Deleting and recreating,
      # rather than editing in place, is what keeps the tag pointing at the
      # commit that produced the assets.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: krb5-macos-${{ matrix.arch }}-latest
          TITLE: MIT Kerberos (macOS ${{ matrix.arch }})
          ASSET: ${{ runner.temp }}/krb5-macos-${{ matrix.arch }}-latest.tar.gz
        run: |
          set -euo pipefail

          # True only when the release exists, is not a draft, and therefore
          # has a real tag behind it that consumers can download by.
          is_published() {
              [ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]
          }

          for attempt in 1 2 3 4 5; do
              gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                  --cleanup-tag --yes || true

              if gh release create "${TAG}" "${ASSET}" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "${TITLE}" \
                      --prerelease; then
                  if is_published; then
                      echo "Published ${TAG}"
                      exit 0
                  fi
                  # gh creates the release as a draft, uploads the assets and
                  # only then flips it to published. Under contention it has
                  # been seen to exit zero having left the release a draft,
                  # which looks like a working release in the web interface but
                  # has no tag, so nothing can download it. Ask again, plainly.
                  echo "${TAG} was left as a draft; publishing it explicitly"
                  gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --draft=false || true
                  if is_published; then
                      echo "Published ${TAG}"
                      exit 0
                  fi
              fi

              echo "Publishing ${TAG} failed on attempt ${attempt}; backing off"
              sleep $((attempt * 30))
          done

          echo "Giving up on ${TAG} after 5 attempts" >&2
          exit 1
