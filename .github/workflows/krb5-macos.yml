name: Build KRB5 (macOS)

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-krb5:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      KRB5_VERSION: ${{ needs.get-versions.outputs.KRB5_VERSION }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://kerberos.org/dist/krb5/1.22/krb5-${KRB5_VERSION}.tar.gz" \
              -o "krb5-${KRB5_VERSION}.tar.gz"
          tar zxf "krb5-${KRB5_VERSION}.tar.gz"

      - name: Configure
        run: |
          cd "krb5-${KRB5_VERSION}/src"
          ./configure --prefix="${PGBUILD_PREFIX}/krb5"

      - name: Build
        run: |
          cd "krb5-${KRB5_VERSION}/src"
          make -j4 all

      # Upstream's `make check` is deliberately not run. It was already skipped
      # by the Jenkins jobs this workflow replaces, because large parts of the
      # krb5 test suite stand up a KDC and talk to it over the loopback
      # interface with fixed ports and a writable /etc, which neither the old
      # build farm nor an ephemeral GitHub runner provides. We only consume
      # libgssapi_krb5 and libkrb5 for libpq's GSSAPI support, which the
      # PostgreSQL build exercises in turn, so the cost of getting the full
      # suite running has never been worth it. Keeping it skipped, and saying
      # so here, is better than pretending the coverage exists.

      - name: Install
        run: |
          cd "krb5-${KRB5_VERSION}/src"
          make install

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: krb5
          install-dir: ${{ env.PGBUILD_PREFIX }}/krb5

      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/krb5-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" krb5

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: krb5-${{ env.KRB5_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/krb5-macos-${{ matrix.arch }}-latest.tar.gz

      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: ${{ runner.temp }}/krb5-macos-${{ matrix.arch }}-latest.tar.gz
          tag: krb5-macos-${{ matrix.arch }}-latest
          title: MIT Kerberos (macOS ${{ matrix.arch }})
          version: ${{ env.KRB5_VERSION }}
          immutable-tag: krb5-${{ env.KRB5_VERSION }}-macos-${{ matrix.arch }}
          immutable-title: MIT Kerberos ${{ env.KRB5_VERSION }} (macOS ${{ matrix.arch }})
