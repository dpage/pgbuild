name: Build gettext (Windows)

on:
  workflow_dispatch:
  workflow_call:

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json
  build-gettext:
    runs-on: windows-latest
    needs: get-versions
    defaults:
      run:
        shell: msys2 {0}
    env:
      LIBICONV_VERSION: ${{needs.get-versions.outputs.LIBICONV_VERSION}}
      GETTEXT_VERSION: ${{needs.get-versions.outputs.GETTEXT_VERSION}}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc automake autoconf pkg-config make zip patch tar

      - name: Download libiconv
        uses: actions/download-artifact@v7
        with:
          name: libiconv-${{ env.LIBICONV_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download
        run: |
          # ftp.gnu.org is intermittently unroutable from the runners, so fall
          # back to a mirror rather than failing the entire build.
          for host in https://ftp.gnu.org/pub/gnu https://mirrors.kernel.org/gnu; do
            curl -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              $host/gettext/gettext-${{ env.GETTEXT_VERSION }}.tar.gz \
              -o ./gettext-${{ env.GETTEXT_VERSION }}.tar.gz && break
          done
          tar zxvf gettext-${{ env.GETTEXT_VERSION }}.tar.gz

      - name: Patch
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://raw.githubusercontent.com/vslavik/gettext-tools-windows/refs/heads/master/patches/gettext-0.23-pthread_sigmask.patch -o gettext-0.23-pthread_sigmask.patch
          cd gettext-${{ env.GETTEXT_VERSION }}
          patch -p1 < ../gettext-0.23-pthread_sigmask.patch

      - name: Configure
        run: |
          cd gettext-${{ env.GETTEXT_VERSION }}
          ./configure CFLAGS="$CFLAGS -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration" \
            --prefix=$(pwd)/winpgbuild \
            --disable-static \
            --disable-dependency-tracking \
            --enable-silent-rules \
            --with-libiconv-prefix=/builddeps \
            --disable-rpath \
            --enable-nls \
            --disable-csharp \
            --disable-java \
            --enable-threads=windows \
            --enable-relocatable

      - name: Build
        run: |
          cd gettext-${{ env.GETTEXT_VERSION }}
          make all

      - name: Install
        run: |
          cd gettext-${{ env.GETTEXT_VERSION }}
          make install

          cp winpgbuild/lib/libintl.dll.a winpgbuild/lib/libintl.lib
          cp winpgbuild/lib/libasprintf.dll.a winpgbuild/lib/libasprintf.lib

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: gettext
          install-dir: gettext-${{ env.GETTEXT_VERSION }}/winpgbuild

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: gettext-${{ env.GETTEXT_VERSION }}-src
          path: gettext-${{ env.GETTEXT_VERSION }}.tar.gz

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: gettext-${{ env.GETTEXT_VERSION }}-windows-x86_64
          path: gettext-${{ env.GETTEXT_VERSION }}/winpgbuild

      - name: Package Release Assets
        run: |
          cd gettext-${{ env.GETTEXT_VERSION }}
          mv winpgbuild gettext
          zip -r gettext-windows-x86_64-latest.zip gettext
          
      # The tag is moved rather than the release deleted and remade.
      # Deleting first meant that any failure in the step below, whether
      # permissions, a rate limit or a network blip, left no release at
      # all rather than the previous build: that is how
      # openssl-windows-x86_64-latest came to be absent for four days.
      # action-gh-release updates an existing release in place, so all
      # that is needed is for the rolling tag to point at the commit that
      # produced these assets. Allowed to fail, since the tag will not
      # exist the first time.
      - name: Move the rolling tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/gettext-windows-x86_64-latest" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true

      - name: Create Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "gettext-windows-x86_64-latest"
          target_commitish: ${{ github.sha }}
          name: "gettext (Windows x86_64)"
          prerelease: true
          files: |
            gettext-${{ env.GETTEXT_VERSION }}/gettext-windows-x86_64-latest.zip
