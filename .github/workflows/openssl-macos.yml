name: Build OpenSSL (macOS)

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above. The Jenkins jobs this
  # replaces never set a deployment target and simply inherited whatever the
  # builder's SDK happened to default to, which quietly tied the floor to the
  # build machine; pinning it here makes the supported floor explicit and
  # independent of the runner image.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-openssl:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      OPENSSL_VERSION: ${{ needs.get-versions.outputs.OPENSSL_VERSION }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
              -o "openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf "openssl-${OPENSSL_VERSION}.tar.gz"

      - name: Configure
        run: |
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure \
              --openssldir="${PGBUILD_PREFIX}/openssl" \
              --prefix="${PGBUILD_PREFIX}/openssl" \
              shared \
              "darwin64-$(uname -m)-cc" \
              enable-ec_nistp_64_gcc_128 \
              no-ssl2 \
              no-ssl3 \
              no-comp

      - name: Build
        run: |
          cd "openssl-${OPENSSL_VERSION}"
          make depend
          make -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: |
          cd "openssl-${OPENSSL_VERSION}"
          make test

      - name: Install
        run: |
          cd "openssl-${OPENSSL_VERSION}"
          make install

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: openssl
          install-dir: ${{ env.PGBUILD_PREFIX }}/openssl

      # A gzipped tar rather than a zip, because it is the only one of the two
      # that keeps the dylib version symlinks and the executable bits intact,
      # both of which matter to anything that later links against this tree.
      # The same tarball is used for the in-run artifact and the release asset
      # so that downstream jobs see exactly what consumers download.
      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/openssl-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" openssl

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: openssl-${{ env.OPENSSL_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/openssl-macos-${{ matrix.arch }}-latest.tar.gz

      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: ${{ runner.temp }}/openssl-macos-${{ matrix.arch }}-latest.tar.gz
          tag: openssl-macos-${{ matrix.arch }}-latest
          title: OpenSSL (macOS ${{ matrix.arch }})
          version: ${{ env.OPENSSL_VERSION }}
          immutable-tag: openssl-${{ env.OPENSSL_VERSION }}-macos-${{ matrix.arch }}
          immutable-title: OpenSSL ${{ env.OPENSSL_VERSION }} (macOS ${{ matrix.arch }})
