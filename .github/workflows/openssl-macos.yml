name: Build OpenSSL (macOS)

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above. The Jenkins jobs this
  # replaces never set a deployment target and simply inherited whatever the
  # builder's SDK happened to default to, which quietly tied the floor to the
  # build machine; pinning it here makes the supported floor explicit and
  # independent of the runner image.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  PGBUILD_PREFIX: /opt/pgbuild

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-openssl:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      OPENSSL_VERSION: ${{ needs.get-versions.outputs.OPENSSL_VERSION }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
              -o "openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf "openssl-${OPENSSL_VERSION}.tar.gz"

      - name: Configure
        run: |
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure \
              --openssldir="${PGBUILD_PREFIX}/openssl" \
              --prefix="${PGBUILD_PREFIX}/openssl" \
              shared \
              "darwin64-$(uname -m)-cc" \
              enable-ec_nistp_64_gcc_128 \
              no-ssl2 \
              no-ssl3 \
              no-comp

      - name: Build
        run: |
          cd "openssl-${OPENSSL_VERSION}"
          make depend
          make -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: |
          cd "openssl-${OPENSSL_VERSION}"
          make test

      - name: Install
        run: |
          cd "openssl-${OPENSSL_VERSION}"
          make install

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: openssl
          install-dir: ${{ env.PGBUILD_PREFIX }}/openssl

      # A gzipped tar rather than a zip, because it is the only one of the two
      # that keeps the dylib version symlinks and the executable bits intact,
      # both of which matter to anything that later links against this tree.
      # The same tarball is used for the in-run artifact and the release asset
      # so that downstream jobs see exactly what consumers download.
      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/openssl-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" openssl

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: openssl-${{ env.OPENSSL_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/openssl-macos-${{ matrix.arch }}-latest.tar.gz

      # Publishing is done with the gh CLI and a retry loop rather than with
      # softprops/action-gh-release, because GitHub applies a secondary rate
      # limit to release and tag creation that several matrix jobs finishing at
      # once will trip. It surfaces as a bare 403 on the create call, with
      # nothing in the response identifying it as a rate limit, and the action
      # reads that as a permissions failure and refuses to retry, which turns a
      # few seconds of back-off into a failed build. Deleting and recreating,
      # rather than editing in place, is what keeps the tag pointing at the
      # commit that produced the assets.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: openssl-macos-${{ matrix.arch }}-latest
          TITLE: OpenSSL (macOS ${{ matrix.arch }})
          ASSET: ${{ runner.temp }}/openssl-macos-${{ matrix.arch }}-latest.tar.gz
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
              gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                  --cleanup-tag --yes || true
              if gh release create "${TAG}" "${ASSET}" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "${TITLE}" \
                      --prerelease; then
                  echo "Published ${TAG}"
                  exit 0
              fi
              echo "Publishing ${TAG} failed on attempt ${attempt}; backing off"
              sleep $((attempt * 30))
          done
          echo "Giving up on ${TAG} after 5 attempts" >&2
          exit 1
