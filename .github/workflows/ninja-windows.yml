name: Package Ninja (Windows)

on:
  workflow_dispatch:
  workflow_call:
    
# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  package-ninja:
    needs: get-versions
    runs-on: windows-latest
    env:
      NINJA_VERSION:  ${{needs.get-versions.outputs.NINJA_VERSION}}
    steps:
      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v${{ env.NINJA_VERSION }}/ninja-win.zip
          mkdir /ninja/bin

          unzip ninja.zip
          cp ninja.exe /ninja/bin
          ls /ninja/bin
          $ENV:PATH="/ninja/bin;$ENV:PATH"
          ninja --version || true

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: ninja
          install-dir: /ninja

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ninja-${{ env.NINJA_VERSION }}-windows-x86_64
          path: /ninja
