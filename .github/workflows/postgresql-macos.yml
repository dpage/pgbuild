name: Build PostgreSQL (macOS)

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-postgresql:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.get-versions.outputs.POSTGRESQL_VERSION) }}
        arch: [arm64, x86_64]

    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}

    env:
      OPENSSL_VERSION: ${{ needs.get-versions.outputs.OPENSSL_VERSION }}
      KRB5_VERSION: ${{ needs.get-versions.outputs.KRB5_VERSION }}
      ZSTD_VERSION: ${{ needs.get-versions.outputs.ZSTD_VERSION }}
      LZ4_VERSION: ${{ needs.get-versions.outputs.LZ4_VERSION }}
      ICU_VERSION: ${{ needs.get-versions.outputs.ICU_VERSION }}
      PG_VERSION: ${{ matrix.version }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"
          mkdir -p "${RUNNER_TEMP}/deps"

      # When run via build-all-macos (workflow_call), each dependency artifact
      # is produced earlier in the same run, so these same-run lookups succeed.
      # continue-on-error lets a standalone dispatch, where no such artifact
      # exists, fall through to the release fallback below instead of failing
      # the job.
      - name: Download openssl
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: openssl-${{ env.OPENSSL_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps

      - name: Download krb5
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: krb5-${{ env.KRB5_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps

      - name: Download zstd
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: zstd-${{ env.ZSTD_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps

      - name: Download lz4
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: lz4-${{ env.LZ4_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps

      - name: Download icu
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: icu-${{ env.ICU_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps

      # Anything the steps above could not supply is pulled from the rolling
      # per-package release instead, which is what a standalone dispatch of
      # this workflow always ends up doing.
      - name: Download dependencies (release fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in openssl krb5 zstd lz4 icu; do
              tarball="${pkg}-macos-${ARCH}-latest.tar.gz"
              if [ ! -f "${RUNNER_TEMP}/deps/${tarball}" ]; then
                  echo "Fetching ${tarball} from the ${pkg}-macos-${ARCH}-latest release"
                  gh release download "${pkg}-macos-${ARCH}-latest" \
                      --repo "${{ github.repository }}" \
                      --pattern "${tarball}" \
                      --dir "${RUNNER_TEMP}/deps"
              fi
          done

      - name: Install dependencies
        run: |
          for pkg in openssl krb5 zstd lz4 icu; do
              tar -xzf "${RUNNER_TEMP}/deps/${pkg}-macos-${ARCH}-latest.tar.gz" \
                  -C "${PGBUILD_PREFIX}"
          done

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://ftp.postgresql.org/pub/source/v${PG_VERSION}/postgresql-${PG_VERSION}.tar.gz" \
              -o "postgresql-${PG_VERSION}.tar.gz"
          tar zxf "postgresql-${PG_VERSION}.tar.gz"

      - name: Configure
        run: |
          cd "postgresql-${PG_VERSION}"

          # PostgreSQL finds ICU, lz4 and zstd through pkg-config, and the
          # runner image ships Homebrew copies of all three. Without this,
          # configure happily reports -I/opt/homebrew/opt/zstd/include ahead of
          # our own include directory, so the build compiles against Homebrew's
          # headers whilst linking our libraries, which is the sort of
          # arrangement that works right up until the two versions diverge.
          # PKG_CONFIG_PATH is searched before pkg-config's built-in
          # directories, so putting our trees here makes it resolve to the
          # libraries we actually built and ship.
          export PKG_CONFIG_PATH="${PGBUILD_PREFIX}/icu/lib/pkgconfig:${PGBUILD_PREFIX}/zstd/lib/pkgconfig:${PGBUILD_PREFIX}/lz4/lib/pkgconfig:${PGBUILD_PREFIX}/openssl/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          # --with-zstd and --with-lz4 are both new relative to the Jenkins
          # macOS jobs this replaces, which had neither. Without them pg_dump
          # and pg_restore on macOS cannot read a zstd-compressed dump that
          # the Windows build produces quite happily, which is
          # pgadmin-org/pgadmin4 issue #9425.
          #
          # --with-lz4 has existed since PostgreSQL 14, but --with-zstd only
          # arrived in 15, so it is omitted on older branches rather than
          # failing configure outright.
          #
          # --with-icu is new as well. The macOS build was configured
          # --without-icu for as long as there was no ICU of ours to link, and
          # linking whatever the machine happened to have was never the
          # intention; icu-macos.yml now builds one, so it is linked like any
          # other dependency. PostgreSQL locates ICU through pkg-config alone,
          # which is why its pkgconfig directory goes on the path above.
          pg_major="${PG_VERSION%%.*}"
          zstd_arg="--with-zstd"
          if [ "${pg_major}" -lt 15 ]; then
              zstd_arg=""
              echo "PostgreSQL ${PG_VERSION} predates --with-zstd; building without it"
          fi

          ./configure \
              --prefix="${PGBUILD_PREFIX}/postgresql" \
              --with-openssl \
              --with-gssapi \
              ${zstd_arg} \
              --with-lz4 \
              --with-includes="${PGBUILD_PREFIX}/openssl/include ${PGBUILD_PREFIX}/krb5/include ${PGBUILD_PREFIX}/zstd/include ${PGBUILD_PREFIX}/lz4/include ${PGBUILD_PREFIX}/icu/include" \
              --with-libraries="${PGBUILD_PREFIX}/openssl/lib ${PGBUILD_PREFIX}/krb5/lib ${PGBUILD_PREFIX}/zstd/lib ${PGBUILD_PREFIX}/lz4/lib ${PGBUILD_PREFIX}/icu/lib" \
              --with-icu

      - name: Build
        run: |
          cd "postgresql-${PG_VERSION}"
          make -j"$(sysctl -n hw.ncpu)" world-bin

      - name: Install
        run: |
          cd "postgresql-${PG_VERSION}"
          make install-world-bin

      # PostgreSQL's `make check` cannot work on macOS. It builds a temporary
      # install and then relies on DYLD_LIBRARY_PATH to point the freshly built
      # binaries at the matching libpq, but System Integrity Protection strips
      # every DYLD_* variable from the environment of a protected process, so
      # the temporary install's libpq is never found. On the Jenkins hosts it
      # only appeared to pass because earlier runs had left a libpq behind in
      # the real installation directory for the binaries to fall back on; an
      # ephemeral runner starts clean and has no such thing.
      #
      # We therefore install first and run installcheck against a server
      # started from the installed tree. Those binaries carry absolute
      # install_names pointing at ${PGBUILD_PREFIX}, so they resolve their
      # libraries without any DYLD_* help and SIP is irrelevant.
      - name: Test
        run: |
          export PATH="${PGBUILD_PREFIX}/postgresql/bin:${PATH}"
          export PGDATA="${RUNNER_TEMP}/pgdata"
          export PGHOST="${RUNNER_TEMP}"
          export PGPORT=55432
          export PGUSER=postgres

          # --no-locale gives the C collation the expected outputs were
          # generated against, so that the test results depend on PostgreSQL
          # rather than on whichever locale the runner image happens to be set
          # to. UTF-8 is asked for explicitly because --no-locale would
          # otherwise leave the encoding at SQL_ASCII.
          initdb -D "${PGDATA}" -U postgres --no-sync --no-locale \
              --encoding=UTF8

          # A non-default port, and a socket directory under RUNNER_TEMP,
          # because the regression suite should not care what else the image
          # ships with.
          pg_ctl -D "${PGDATA}" -l "${RUNNER_TEMP}/postmaster.log" \
              -o "-p ${PGPORT} -k ${PGHOST}" -w start

          cd "postgresql-${PG_VERSION}"
          make -C src/test/regress installcheck

          pg_ctl -D "${PGDATA}" -w stop

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: postgresql-${{ matrix.version }}-macos-${{ matrix.arch }}-test-logs
          path: |
            postgresql-${{ matrix.version }}/src/test/regress/regression.diffs
            postgresql-${{ matrix.version }}/src/test/regress/log/**
            ${{ runner.temp }}/postmaster.log
        if: always()

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
          sparse-checkout-cone-mode: false

      - name: Copy dependency SPDX manifests
        run: |
          mkdir -p "${PGBUILD_PREFIX}/postgresql/MANIFESTS"
          for pkg in openssl krb5 zstd lz4 icu; do
              if [ -d "${PGBUILD_PREFIX}/${pkg}/MANIFESTS" ]; then
                  cp "${PGBUILD_PREFIX}/${pkg}/MANIFESTS"/*.spdx.json \
                     "${PGBUILD_PREFIX}/postgresql/MANIFESTS/"
              fi
          done

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: postgresql
          install-dir: ${{ env.PGBUILD_PREFIX }}/postgresql
          version: ${{ matrix.version }}

      - name: Package
        id: majorVersion
        run: |
          major_ver="${PG_VERSION%%.*}"
          tar -czf "${RUNNER_TEMP}/postgresql-${major_ver}-macos-${ARCH}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" postgresql
          echo "majorVersion=${major_ver}" >> "${GITHUB_OUTPUT}"

          # A checksum beside the archive, in sha256sum's own format so that
          # whoever has downloaded the pair can run `shasum -c` over them
          # unedited, and written from the archive's own directory so that the
          # name recorded in it is the bare file name rather than a path off
          # this runner.
          cd "${RUNNER_TEMP}"
          shasum -a 256 "postgresql-${major_ver}-macos-${ARCH}-latest.tar.gz" \
              > "postgresql-${major_ver}-macos-${ARCH}-latest.tar.gz.sha256"

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: postgresql-${{ matrix.version }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/postgresql-${{ steps.majorVersion.outputs.majorVersion }}-macos-${{ matrix.arch }}-latest.tar.gz

      # Refreshing a rolling release means replacing its asset, not tearing the
      # release down and building a new one. Creating a release is the
      # expensive operation, and the one that has repeatedly come back as a
      # bare 403 "Resource not accessible by integration" under load, for
      # twenty minutes at a stretch, on a token that the same job had just used
      # to delete a release successfully and that logged Contents: write.
      # Whatever GitHub-side throttle that is, the way not to meet it is not to
      # create a release every night: the tag is created once, and from then on
      # each build moves it to the new commit and clobbers the asset in place.
      # That also keeps the release's identity and URL intact between builds,
      # which deleting and recreating did not.
      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: postgresql-${{ steps.majorVersion.outputs.majorVersion }}-macos-${{ matrix.arch }}-latest
          TITLE: PostgreSQL ${{ steps.majorVersion.outputs.majorVersion }} (macOS ${{ matrix.arch }})
          ASSET: ${{ runner.temp }}/postgresql-${{ steps.majorVersion.outputs.majorVersion }}-macos-${{ matrix.arch }}-latest.tar.gz
          CHECKSUM: ${{ runner.temp }}/postgresql-${{ steps.majorVersion.outputs.majorVersion }}-macos-${{ matrix.arch }}-latest.tar.gz.sha256
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail

          # Stated on the release itself, so that the version built and the
          # digest published can both be read off the release page: a rolling
          # tag gives a reader nothing else to go on, and downloading the
          # asset in order to find out what it is rather defeats the purpose.
          NOTES="$(printf 'Upstream version: %s\n\n    %s\n' \
              "${VERSION}" "$(cat "${CHECKSUM}")")"

          # True only when the release exists and is not a draft, since a draft
          # has no tag behind it and so cannot be downloaded by tag, however
          # healthy it looks in the web interface.
          is_published() {
              [ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]
          }

          publish() {
              if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      >/dev/null 2>&1; then
                  # Move the rolling tag onto the commit that produced these
                  # assets. Allowed to fail: a release left as a draft by an
                  # earlier attempt has no tag yet, and the edit below makes
                  # one.
                  gh api -X PATCH \
                      "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                      -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 \
                      || true
                  gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --title "${TITLE}" --notes "${NOTES}" \
                      --prerelease --draft=false \
                      >/dev/null &&
                  gh release upload "${TAG}" "${ASSET}" "${CHECKSUM}" \
                      --repo "${GITHUB_REPOSITORY}" --clobber
              else
                  gh release create "${TAG}" "${ASSET}" "${CHECKSUM}" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "${TITLE}" \
                      --notes "${NOTES}" \
                      --prerelease
              fi
          }

          # The back-off is deliberately generous, because throwing away a
          # thirty-minute build that has already passed its tests, over an API
          # call that may well work a few minutes later, would be absurd.
          for attempt in 1 2 3 4 5 6 7 8; do
              if publish && is_published; then
                  echo "Published ${TAG}"
                  exit 0
              fi

              delay=$((attempt * 60))
              if [ "${delay}" -gt 300 ]; then
                  delay=300
              fi
              echo "Publishing ${TAG} failed on attempt ${attempt};" \
                   "retrying in ${delay}s"
              sleep "${delay}"
          done

          echo "Giving up on ${TAG} after 8 attempts" >&2
          exit 1

      # The rolling release above says what is newest; this one says what a
      # given upstream version was. Anything that pins a digest needs the
      # latter, because the -latest asset is clobbered by the next build and
      # the bytes somebody pinned this morning are gone by tomorrow. It is
      # created the first time a version is built and never touched again, so
      # it costs a release creation when the upstream version changes rather
      # than nightly, which is a small fraction of the load the comment above
      # is about.
      - name: Publish Immutable Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: postgresql-${{ matrix.version }}-macos-${{ matrix.arch }}
          TITLE: PostgreSQL ${{ matrix.version }} (macOS ${{ matrix.arch }})
          VERSION: ${{ matrix.version }}
          ASSET: ${{ runner.temp }}/postgresql-${{ steps.majorVersion.outputs.majorVersion }}-macos-${{ matrix.arch }}-latest.tar.gz
        run: |
          set -euo pipefail

          # Immutable means immutable: a rebuild of a version that has already
          # been published is precisely the case this exists for, so nothing
          # is uploaded over it. Should one genuinely need republishing,
          # because the build changed rather than the upstream release, that
          # is a deliberate act rather than something to automate.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                  >/dev/null 2>&1; then
              echo "${TAG} exists already, so this version has been published"
              echo "before and is being left exactly as it is. To republish"
              echo "it, delete that release and its tag by hand, then run this"
              echo "workflow again."
              exit 0
          fi

          # Named after this release's own tag rather than after the rolling
          # one, so that <tag>/<tag>.tar.gz fetches it the way every other
          # archive here is fetched, and so that a copy found on a disk a week
          # later says what it is. The bytes are the rolling release's exactly,
          # so the digest is the same digest; all that differs is the file name
          # recorded beside it, which is the name `shasum -c` goes looking for.
          cd "${RUNNER_TEMP}"
          cp "${ASSET}" "${TAG}.tar.gz"
          shasum -a 256 "${TAG}.tar.gz" > "${TAG}.tar.gz.sha256"

          NOTES="$(printf 'Upstream version: %s\n\n    %s\n' \
              "${VERSION}" "$(cat "${TAG}.tar.gz.sha256")")"

          # The same generous back-off as the rolling release, and for the
          # same reason. Failing here leaves that release alone, since it has
          # already published and nothing in this step touches it.
          for attempt in 1 2 3 4 5 6 7 8; do
              if gh release create "${TAG}" \
                      "${TAG}.tar.gz" "${TAG}.tar.gz.sha256" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "${TITLE}" \
                      --notes "${NOTES}" \
                      --prerelease; then
                  echo "Published ${TAG}"
                  exit 0
              fi

              delay=$((attempt * 60))
              if [ "${delay}" -gt 300 ]; then
                  delay=300
              fi
              echo "Publishing ${TAG} failed on attempt ${attempt};" \
                   "retrying in ${delay}s"
              sleep "${delay}"
          done

          echo "Giving up on ${TAG} after 8 attempts; the rolling release" >&2
          echo "published above is unaffected." >&2
          exit 1
