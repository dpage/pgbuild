name: Build libxml2 (Windows)

on:
  workflow_dispatch:
  workflow_call:
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-libxml2:
    runs-on: windows-latest
    needs: get-versions
    env:
      ZLIB_VERSION: ${{needs.get-versions.outputs.ZLIB_VERSION}}
      LIBXML2_VERSION: ${{needs.get-versions.outputs.LIBXML2_VERSION}}
    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download zlib
        uses: actions/download-artifact@v7
        with:
          name: zlib-${{ env.ZLIB_VERSION }}-windows-x86_64
          path: /build/zlib

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://gitlab.gnome.org/GNOME/libxml2/-/archive/v${{ env.LIBXML2_VERSION }}/libxml2-v${{ env.LIBXML2_VERSION }}.tar.gz -o ./libxml2-v${{ env.LIBXML2_VERSION }}.tar.gz
          tar zxvf libxml2-v${{ env.LIBXML2_VERSION }}.tar.gz

      - name: Configure
        run: |
          cd libxml2-v${{ env.LIBXML2_VERSION }}
          cmake -B build -D CMAKE_INSTALL_PREFIX=/libxml2 -D CMAKE_PREFIX_PATH="/build/zlib" -D LIBXML2_WITH_ICONV=OFF -D LIBXML2_WITH_LZMA=OFF -D LIBXML2_WITH_PYTHON=OFF

      - name: Build
        run: |
          cd libxml2-v${{ env.LIBXML2_VERSION }}
          cmake --build build --config Release

      - name: Install
        run: |
          cd libxml2-v${{ env.LIBXML2_VERSION }}
          cmake --install build

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: libxml2
          install-dir: /libxml2

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: libxml2-v${{ env.LIBXML2_VERSION }}-src
          path: libxml2-v${{ env.LIBXML2_VERSION }}.tar.gz

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: libxml2-${{ env.LIBXML2_VERSION }}-windows-x86_64
          path: /libxml2

      - name: Package Release Assets
        shell: pwsh
        run: |
          Compress-Archive /libxml2 /libxml2-windows-x86_64-latest.zip
          
      # The tag is moved rather than the release deleted and remade.
      # Deleting first meant that any failure in the step below, whether
      # permissions, a rate limit or a network blip, left no release at
      # all rather than the previous build: that is how
      # openssl-windows-x86_64-latest came to be absent for four days.
      # action-gh-release updates an existing release in place, so all
      # that is needed is for the rolling tag to point at the commit that
      # produced these assets. Allowed to fail, since the tag will not
      # exist the first time.
      - name: Move the rolling tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/libxml2-windows-x86_64-latest" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true

      - name: Create Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "libxml2-windows-x86_64-latest"
          target_commitish: ${{ github.sha }}
          name: "libxml2 (Windows x86_64)"
          prerelease: true
          files: |
            /libxml2-windows-x86_64-latest.zip
