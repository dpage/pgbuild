name: Build All

# A convenience dispatcher for "rebuild everything, now". Each platform
# already has its own nightly orchestrator, so this exists purely so that a
# human does not have to start two runs by hand.
#
# Note that it deliberately does NOT call the two orchestrators with `uses:`.
# GitHub Actions counts unique reusable workflows across a whole call tree and
# caps it at 20, and build-all-windows.yml alone already reaches that cap with
# its 19 leaves plus manifest.yml; calling both orchestrators from here would
# come to 36 and the run would be rejected outright. Dispatching them through
# the API starts two independent runs instead, each with its own call tree, at
# the cost of this job finishing immediately rather than waiting for them.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Build the Windows tree
        type: boolean
        default: true
      macos:
        description: Build the macOS tree
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the platform orchestrators
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.windows }}" = "true" ]; then
              gh workflow run build-all-windows.yml \
                  --repo "${{ github.repository }}" --ref "${REF}"
              echo "Dispatched build-all-windows.yml on ${REF}"
          fi

          if [ "${{ inputs.macos }}" = "true" ]; then
              gh workflow run build-all-macos.yml \
                  --repo "${{ github.repository }}" --ref "${REF}"
              echo "Dispatched build-all-macos.yml on ${REF}"
          fi

          echo "Progress is visible under the Actions tab; this job does not" \
               "wait for either run to finish." >> "${GITHUB_STEP_SUMMARY}"
