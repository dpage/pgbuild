name: Package diffutils (Windows)

on:
  workflow_dispatch:
  workflow_call:

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  package-diffutils:
    runs-on: windows-latest
    needs: get-versions
    env:
      DIFFUTILS_VERSION: ${{needs.get-versions.outputs.DIFFUTILS_VERSION}}

    steps:
      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o diffutils.zip "https://downloads.sourceforge.net/project/gnuwin32/diffutils/${{ env.DIFFUTILS_VERSION }}/diffutils-${{ env.DIFFUTILS_VERSION }}-bin.zip"
          mkdir diffutils
          cd diffutils
          unzip ../diffutils.zip

      - name: Download dependencies
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o diffutils-deps.zip "https://downloads.sourceforge.net/project/gnuwin32/diffutils/${{ env.DIFFUTILS_VERSION }}/diffutils-${{ env.DIFFUTILS_VERSION }}-dep.zip"
          cd diffutils
          unzip ../diffutils-deps.zip

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: diffutils
          install-dir: diffutils

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: diffutils-${{ env.DIFFUTILS_VERSION }}-windows-x86_64
          path: diffutils
