name: Build ICU (Windows)

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-icu:
    runs-on: windows-latest
    needs: get-versions
    env:
      ICU_VERSION: ${{needs.get-versions.outputs.ICU_VERSION}}
    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://github.com/unicode-org/icu/releases/download/release-${{ env.ICU_VERSION }}/icu4c-${{ env.ICU_VERSION }}-sources.zip -o ./icu4c-${{ env.ICU_VERSION }}.zip
          unzip -q ./icu4c-${{ env.ICU_VERSION }}.zip
        shell: bash

      - name: Build
        run: |
          cd icu
          devenv.com source\allinone\allinone.sln /build "Release|x64"

      - name: Install
        run: |
          cd icu

          mkdir \icu

          mkdir \icu\bin64
          copy bin64\* \icu\bin64\

          mkdir \icu\include
          mkdir \icu\include/unicode
          copy include\unicode\* \icu\include\unicode\/

          mkdir \icu\lib64
          copy lib64\* \icu\lib64\

      - name: Create pkgconfig Files
        run: |
          mkdir \icu\lib
          mkdir \icu\lib\pkgconfig

          >> \icu\lib\pkgconfig\icu-uc.pc echo prefix=${pcfiledir}/../..
          >> \icu\lib\pkgconfig\icu-uc.pc echo exec_prefix=${prefix}
          >> \icu\lib\pkgconfig\icu-uc.pc echo libdir=${prefix}/lib64
          >> \icu\lib\pkgconfig\icu-uc.pc echo includedir=${prefix}/include
          >> \icu\lib\pkgconfig\icu-uc.pc echo.
          >> \icu\lib\pkgconfig\icu-uc.pc echo Name: icu-uc
          >> \icu\lib\pkgconfig\icu-uc.pc echo Description: International Components for Unicode: Common and Data libraries
          >> \icu\lib\pkgconfig\icu-uc.pc echo Version: ${{ env.ICU_VERSION }}
          >> \icu\lib\pkgconfig\icu-uc.pc echo Libs: -L${libdir} -licuuc -licudt
          >> \icu\lib\pkgconfig\icu-uc.pc echo Cflags: -I${includedir}

          >> \icu\lib\pkgconfig\icu-i18n.pc echo prefix=${pcfiledir}/../..
          >> \icu\lib\pkgconfig\icu-i18n.pc echo exec_prefix=${prefix}
          >> \icu\lib\pkgconfig\icu-i18n.pc echo libdir=${prefix}/lib64
          >> \icu\lib\pkgconfig\icu-i18n.pc echo includedir=${prefix}/include
          >> \icu\lib\pkgconfig\icu-i18n.pc echo.
          >> \icu\lib\pkgconfig\icu-i18n.pc echo Name: icu-i18n
          >> \icu\lib\pkgconfig\icu-i18n.pc echo Description: International Components for Unicode: Internationalization library
          >> \icu\lib\pkgconfig\icu-i18n.pc echo Version: ${{ env.ICU_VERSION }}
          >> \icu\lib\pkgconfig\icu-i18n.pc echo Libs: -L${libdir} -licuin
          >> \icu\lib\pkgconfig\icu-i18n.pc echo Cflags: -I${includedir}
        shell: cmd

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: icu
          install-dir: /icu

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: icu-${{ env.ICU_VERSION }}-src
          path: icu4c-${{ env.ICU_VERSION }}.zip

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: icu-${{ env.ICU_VERSION }}-windows-x86_64
          path: /icu

      - name: Package Release Assets
        shell: pwsh
        run: |
          Compress-Archive /icu /icu-windows-x86_64-latest.zip
          
      # A checksum beside the archive, in sha256sum's own format, which is the
      # digest and two spaces and the bare file name, so that whoever has
      # downloaded the pair can run `shasum -c` over them unedited. It is
      # written with an explicit LF rather than the CRLF PowerShell would
      # otherwise leave, because the carriage return would end up as part of
      # the name shasum then went looking for.
      - name: Checksum Release Assets
        id: checksum
        shell: pwsh
        run: |
          $archive = '/icu-windows-x86_64-latest.zip'
          $name = Split-Path -Leaf $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          Set-Content -Path "$archive.sha256" -Value "$hash  $name`n" -NoNewline
          Write-Output "sha256=$hash" >> $Env:GITHUB_OUTPUT

      # The tag is moved rather than the release deleted and remade.
      # Deleting first meant that any failure in the step below, whether
      # permissions, a rate limit or a network blip, left no release at
      # all rather than the previous build: that is how
      # openssl-windows-x86_64-latest came to be absent for four days.
      # action-gh-release updates an existing release in place, so all
      # that is needed is for the rolling tag to point at the commit that
      # produced these assets. Allowed to fail, since the tag will not
      # exist the first time.
      - name: Move the rolling tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/icu-windows-x86_64-latest" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true

      - name: Create Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "icu-windows-x86_64-latest"
          target_commitish: ${{ github.sha }}
          name: "icu (Windows x86_64)"
          prerelease: true
          body: |
            Upstream version: ${{ env.ICU_VERSION }}

                ${{ steps.checksum.outputs.sha256 }}  icu-windows-x86_64-latest.zip
          files: |
            /icu-windows-x86_64-latest.zip
            /icu-windows-x86_64-latest.zip.sha256

      # The rolling release above says what is newest; this one says what a
      # given upstream version was. Anything that pins a digest needs the
      # latter, because the -latest asset is clobbered by the next build and
      # the bytes somebody pinned this morning are gone by tomorrow. It is
      # created the first time a version is built and never touched again, so
      # it costs a release creation when the upstream version changes rather
      # than nightly, which is a small fraction of the load the macOS leaves
      # warn about.
      - name: Prepare the Immutable Release
        if: github.ref == 'refs/heads/main'
        id: immutable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An absent release is the ordinary case here rather than an error,
          # so the pwsh default of turning a non-zero exit from a native
          # command into a terminating one has to be out of the way.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = 'icu-${{ env.ICU_VERSION }}-windows-x86_64'
          gh release view $tag --repo $Env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              # Immutable means immutable: a rebuild of a version that has
              # already been published is precisely the case this exists for,
              # so nothing is uploaded over it.
              Write-Output "$tag exists already, so this version has been"
              Write-Output "published before and is being left exactly as"
              Write-Output "it is. To republish it, because the build"
              Write-Output "changed rather than the upstream release,"
              Write-Output "delete that release and its tag by hand, then"
              Write-Output "run this workflow again."
              Write-Output "publish=false" >> $Env:GITHUB_OUTPUT
              exit 0
          }

          # Named after this release's own tag rather than after the rolling
          # one, so that <tag>/<tag>.zip fetches it the way every other archive
          # here is fetched, and so that a copy found on a disk a week later
          # says what it is. The bytes are the rolling release's exactly, so
          # the digest is the same digest; all that differs is the file name
          # recorded beside it, which is the name `shasum -c` goes looking for.
          $copy = "/$tag.zip"
          Copy-Item -LiteralPath '/icu-windows-x86_64-latest.zip' -Destination $copy -Force
          $hash = (Get-FileHash -Algorithm SHA256 $copy).Hash.ToLower()
          Set-Content -Path "$copy.sha256" -Value "$hash  $tag.zip`n" -NoNewline
          Write-Output "sha256=$hash" >> $Env:GITHUB_OUTPUT
          Write-Output "publish=true" >> $Env:GITHUB_OUTPUT
          exit 0

      - name: Create Immutable Release
        if: github.ref == 'refs/heads/main' && steps.immutable.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "icu-${{ env.ICU_VERSION }}-windows-x86_64"
          target_commitish: ${{ github.sha }}
          name: "icu ${{ env.ICU_VERSION }} (Windows x86_64)"
          prerelease: true
          body: |
            Upstream version: ${{ env.ICU_VERSION }}

                ${{ steps.immutable.outputs.sha256 }}  icu-${{ env.ICU_VERSION }}-windows-x86_64.zip
          files: |
            /icu-${{ env.ICU_VERSION }}-windows-x86_64.zip
            /icu-${{ env.ICU_VERSION }}-windows-x86_64.zip.sha256
