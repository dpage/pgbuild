name: Build libiconv (macOS)

on:
  workflow_dispatch:
  workflow_call:


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-libiconv:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      LIBICONV_VERSION: ${{ needs.get-versions.outputs.LIBICONV_VERSION }}

    steps:
      # macOS has an iconv of its own in /usr/lib, which is why this was left
      # out of the first cut of the macOS tree as one more thing not worth
      # building. It is not GNU libiconv, though, and gettext wants that one
      # specifically: built against the system copy, libtextstyle fails to
      # link with _iconv_ostream_create undefined, the object defining it
      # being compiled only when GNU libiconv is there to back it. So it is
      # built here, exactly as it is on Windows, and gettext is pointed at it.
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"

      - name: Download
        run: |
          # ftp.gnu.org is intermittently unroutable from the runners, so fall
          # back to a mirror rather than failing the entire build.
          for host in https://ftp.gnu.org/pub/gnu https://mirrors.kernel.org/gnu; do
              curl -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                  "${host}/libiconv/libiconv-${LIBICONV_VERSION}.tar.gz" \
                  -o "libiconv-${LIBICONV_VERSION}.tar.gz" && break
          done
          tar zxf "libiconv-${LIBICONV_VERSION}.tar.gz"

      # --disable-nls keeps the dependency pointing one way. libiconv's own
      # messages would be translated by gettext, which is built after it and
      # against it, and neither its diagnostics nor its translations are what
      # anything here consumes.
      - name: Configure
        run: |
          cd "libiconv-${LIBICONV_VERSION}"
          ./configure \
              --prefix="${PGBUILD_PREFIX}/libiconv" \
              --disable-static \
              --disable-dependency-tracking \
              --disable-nls

      - name: Build
        run: |
          cd "libiconv-${LIBICONV_VERSION}"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Install
        run: |
          cd "libiconv-${LIBICONV_VERSION}"
          make install

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: libiconv
          install-dir: ${{ env.PGBUILD_PREFIX }}/libiconv

      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/libiconv-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" libiconv

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: libiconv-${{ env.LIBICONV_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/libiconv-macos-${{ matrix.arch }}-latest.tar.gz

      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: ${{ runner.temp }}/libiconv-macos-${{ matrix.arch }}-latest.tar.gz
          tag: libiconv-macos-${{ matrix.arch }}-latest
          title: libiconv (macOS ${{ matrix.arch }})
          version: ${{ env.LIBICONV_VERSION }}
          immutable-tag: libiconv-${{ env.LIBICONV_VERSION }}-macos-${{ matrix.arch }}
          immutable-title: libiconv ${{ env.LIBICONV_VERSION }} (macOS ${{ matrix.arch }})
