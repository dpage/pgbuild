name: Build libxml2 (macOS)

on:
  workflow_dispatch:
  workflow_call:


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-libxml2:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      LIBXML2_VERSION: ${{ needs.get-versions.outputs.LIBXML2_VERSION }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"

      # The GNOME release tarball rather than the GitLab archive of the tag
      # that the Windows leaf takes. The archive is a source snapshot with no
      # generated configure in it, which CMake does not mind but an autotools
      # build does, and regenerating it would mean autoconf, automake and
      # libtool, none of which macOS ships. Releases live in a directory named
      # after the major and minor version, hence the trimmed copy below.
      - name: Download
        run: |
          series="${LIBXML2_VERSION%.*}"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://download.gnome.org/sources/libxml2/${series}/libxml2-${LIBXML2_VERSION}.tar.xz" \
              -o "libxml2-${LIBXML2_VERSION}.tar.xz"
          tar xf "libxml2-${LIBXML2_VERSION}.tar.xz"

      # zlib and iconv both come from macOS itself, in /usr/lib, so they are
      # linked rather than built; zlib support is off by default in libxml2's
      # configure and has to be asked for. The Python bindings are declined
      # because they would be built against whichever Python the runner image
      # happens to ship, and what is published here is a C library.
      - name: Configure
        run: |
          cd "libxml2-${LIBXML2_VERSION}"
          ./configure \
              --prefix="${PGBUILD_PREFIX}/libxml2" \
              --with-zlib \
              --with-iconv \
              --without-python

      - name: Build
        run: |
          cd "libxml2-${LIBXML2_VERSION}"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Install
        run: |
          cd "libxml2-${LIBXML2_VERSION}"
          make install

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: libxml2
          install-dir: ${{ env.PGBUILD_PREFIX }}/libxml2

      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/libxml2-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" libxml2

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: libxml2-${{ env.LIBXML2_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/libxml2-macos-${{ matrix.arch }}-latest.tar.gz

      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: ${{ runner.temp }}/libxml2-macos-${{ matrix.arch }}-latest.tar.gz
          tag: libxml2-macos-${{ matrix.arch }}-latest
          title: libxml2 (macOS ${{ matrix.arch }})
          version: ${{ env.LIBXML2_VERSION }}
          immutable-tag: libxml2-${{ env.LIBXML2_VERSION }}-macos-${{ matrix.arch }}
          immutable-title: libxml2 ${{ env.LIBXML2_VERSION }} (macOS ${{ matrix.arch }})
