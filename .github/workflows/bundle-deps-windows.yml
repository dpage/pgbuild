name: Bundle dependencies (Windows)

# There is no immutable per-version companion to this release, as there is for
# the per-package ones, because a bundle has no single upstream version to name
# a tag after. The libraries in it are published immutably by the workflows
# that build them, so anything needing to pin a digest should pin those, whilst
# the build tooling bundled alongside them is an input to a build rather than
# something that is shipped and signed.

on:
  workflow_dispatch:
  workflow_call:

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-all-deps:
    needs: get-versions
    env:
      DIFFUTILS_VERSION: ${{needs.get-versions.outputs.DIFFUTILS_VERSION}}
      GETTEXT_VERSION: ${{needs.get-versions.outputs.GETTEXT_VERSION}}
      ICU_VERSION: ${{needs.get-versions.outputs.ICU_VERSION}}
      KRB5_VERSION: ${{needs.get-versions.outputs.KRB5_VERSION}}
      LIBICONV_VERSION: ${{needs.get-versions.outputs.LIBICONV_VERSION}}
      LIBXML2_VERSION: ${{needs.get-versions.outputs.LIBXML2_VERSION}}
      LIBXSLT_VERSION: ${{needs.get-versions.outputs.LIBXSLT_VERSION}}
      LZ4_VERSION: ${{needs.get-versions.outputs.LZ4_VERSION}}
      MESON_VERSION: ${{needs.get-versions.outputs.MESON_VERSION}}
      NINJA_VERSION: ${{needs.get-versions.outputs.NINJA_VERSION}}
      OPENSSL_VERSION: ${{needs.get-versions.outputs.OPENSSL_VERSION}}
      OSSP-UUID_VERSION: ${{needs.get-versions.outputs.OSSP-UUID_VERSION}}
      PKGCONF_VERSION: ${{needs.get-versions.outputs.PKGCONF_VERSION}}
      WINFLEXBISON_VERSION: ${{needs.get-versions.outputs.WINFLEXBISON_VERSION}}
      ZLIB_VERSION: ${{needs.get-versions.outputs.ZLIB_VERSION}}
      ZSTD_VERSION: ${{needs.get-versions.outputs.ZSTD_VERSION}}
      
        
    runs-on: windows-latest
    steps:
      - name: Download diffutils
        uses: actions/download-artifact@v7
        with:
          name: diffutils-${{ env.DIFFUTILS_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download gettext
        uses: actions/download-artifact@v7
        with:
          name: gettext-${{ env.GETTEXT_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download icu
        uses: actions/download-artifact@v7
        with:
          name: icu-${{ env.ICU_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download krb5
        uses: actions/download-artifact@v7
        with:
          name: krb5-${{ env.KRB5_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download libiconv
        uses: actions/download-artifact@v7
        with:
          name: libiconv-${{ env.LIBICONV_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download libxml2
        uses: actions/download-artifact@v7
        with:
          name: libxml2-${{ env.LIBXML2_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download libxslt
        uses: actions/download-artifact@v7
        with:
          name: libxslt-${{ env.LIBXSLT_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download lz4
        uses: actions/download-artifact@v7
        with:
          name: lz4-${{ env.LZ4_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download meson
        uses: actions/download-artifact@v7
        with:
          name: meson-${{ env.MESON_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download ninja
        uses: actions/download-artifact@v7
        with:
          name: ninja-${{ env.NINJA_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download openssl
        uses: actions/download-artifact@v7
        with:
          name: openssl-${{ env.OPENSSL_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download ossp-uuid
        uses: actions/download-artifact@v7
        with:
          name: ossp-uuid-${{ env.OSSP-UUID_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download pkgconf
        uses: actions/download-artifact@v7
        with:
          name: pkgconf-${{ env.PKGCONF_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download winflexbison
        uses: actions/download-artifact@v7
        with:
          name: winflexbison-${{ env.WINFLEXBISON_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download zlib
        uses: actions/download-artifact@v7
        with:
          name: zlib-${{ env.ZLIB_VERSION }}-windows-x86_64
          path: /builddeps

      - name: Download zstd
        uses: actions/download-artifact@v7
        with:
          name: zstd-${{ env.ZSTD_VERSION }}-windows-x86_64
          path: /builddeps

      # github errors out due to too many files :(
      - name: Remove docs
        run: |
          rm.exe -rf `
              \builddeps\share\docs `
              \builddeps\mesonbuild\docs `
              "\builddeps\mesonbuild\test cases" `
              \builddeps\html

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: all-deps-windows-x86_64
          path: /builddeps

      - name: Package Release Assets
        shell: pwsh
        run: |
          Compress-Archive /builddeps /postgresql-dependencies-windows-x86_64-latest.zip
          
      - name: Checkout publish-release action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Publish Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: /postgresql-dependencies-windows-x86_64-latest.zip
          tag: dependencies-windows-x86_64-latest
          title: "PostgreSQL Dependencies (Windows x86_64)"
          notes: |
            Upstream versions: diffutils ${{ env.DIFFUTILS_VERSION }},
            gettext ${{ env.GETTEXT_VERSION }},
            icu ${{ env.ICU_VERSION }}, krb5 ${{ env.KRB5_VERSION }},
            libiconv ${{ env.LIBICONV_VERSION }},
            libxml2 ${{ env.LIBXML2_VERSION }},
            libxslt ${{ env.LIBXSLT_VERSION }},
            lz4 ${{ env.LZ4_VERSION }}, meson ${{ env.MESON_VERSION }},
            ninja ${{ env.NINJA_VERSION }},
            openssl ${{ env.OPENSSL_VERSION }},
            ossp-uuid ${{ env.OSSP-UUID_VERSION }},
            pkgconf ${{ env.PKGCONF_VERSION }},
            winflexbison ${{ env.WINFLEXBISON_VERSION }},
            zlib ${{ env.ZLIB_VERSION }}, zstd ${{ env.ZSTD_VERSION }}
