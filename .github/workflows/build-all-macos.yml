name: Build All (macOS)

# Single-run DAG that builds the whole macOS tree in dependency order, in the
# same style as build-all-windows.yml. Leaf workflows remain callable on
# demand via workflow_dispatch / workflow_call.
#
# GitHub Actions limits a workflow to 20 unique reusable workflows in its full
# call tree. This orchestrator uses 6 of them: the five macOS leaves plus
# manifest.yml, which every leaf calls and which counts only once. The Windows
# orchestrator is already at 20, which is precisely why the two platforms have
# an orchestrator each rather than sharing one.

on:
  workflow_dispatch:

  # Versions are pinned in manifest.json and bumped by hand, so a rebuild is
  # worth doing when something that determines the output changes: a version,
  # or the workflow that does the building. Rebuilding unchanged sources on a
  # timer republishes every -latest asset for no reason, which means anyone
  # pinning those URLs, pgAdmin's own build included, silently gets different
  # binaries from one day to the next.
  push:
    branches: [ "main" ]
    paths:
      - 'manifest.json'
      - '.github/workflows/manifest.yml'
      - '.github/workflows/*-macos.yml'

  # Weekly, and not as the way builds get published: that is what the triggers
  # above are for. This is a canary. Rebuilding unchanged sources proves the
  # build still works, which is the one thing it can tell us, and upstream
  # tarballs move, runner images change and toolchains update underneath us.
  # Finding that out within a week beats finding out during a release.
  schedule:
    - cron: "00 02 * * 0"

jobs:
  # Tier 0 - no artifact dependencies.
  openssl:
    uses: ./.github/workflows/openssl-macos.yml
  krb5:
    uses: ./.github/workflows/krb5-macos.yml
  zstd:
    uses: ./.github/workflows/zstd-macos.yml
  lz4:
    uses: ./.github/workflows/lz4-macos.yml

  # Tier 1
  postgresql:
    needs: [openssl, krb5, zstd, lz4]
    uses: ./.github/workflows/postgresql-macos.yml
