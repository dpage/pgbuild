name: Build libxslt (macOS)

on:
  workflow_dispatch:
  workflow_call:


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-libxslt:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      LIBXML2_VERSION: ${{ needs.get-versions.outputs.LIBXML2_VERSION }}
      LIBXSLT_VERSION: ${{ needs.get-versions.outputs.LIBXSLT_VERSION }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"
          mkdir -p "${RUNNER_TEMP}/deps"

      # When run via build-all-macos (workflow_call), libxml2 is produced
      # earlier in the same run, so this same-run lookup succeeds.
      # continue-on-error lets a standalone dispatch, where no such artifact
      # exists, fall through to the release fallback below instead of failing
      # the job.
      - name: Download libxml2
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: libxml2-${{ env.LIBXML2_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps

      # Anything the step above could not supply is pulled from the rolling
      # per-package release instead, which is what a standalone dispatch of
      # this workflow always ends up doing.
      - name: Download dependencies (release fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tarball="libxml2-macos-${ARCH}-latest.tar.gz"
          if [ ! -f "${RUNNER_TEMP}/deps/${tarball}" ]; then
              echo "Fetching ${tarball} from the libxml2-macos-${ARCH}-latest release"
              gh release download "libxml2-macos-${ARCH}-latest" \
                  --repo "${{ github.repository }}" \
                  --pattern "${tarball}" \
                  --dir "${RUNNER_TEMP}/deps"
          fi

      - name: Install dependencies
        run: |
          tar -xzf "${RUNNER_TEMP}/deps/libxml2-macos-${ARCH}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}"

      # See libxml2-macos.yml for why this is the GNOME release tarball rather
      # than the GitLab archive the Windows leaf takes.
      - name: Download
        run: |
          series="${LIBXSLT_VERSION%.*}"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://download.gnome.org/sources/libxslt/${series}/libxslt-${LIBXSLT_VERSION}.tar.xz" \
              -o "libxslt-${LIBXSLT_VERSION}.tar.xz"
          tar xf "libxslt-${LIBXSLT_VERSION}.tar.xz"

      # --with-libxml-prefix is not optional here. macOS ships a libxml2 of its
      # own in /usr/lib, with an xml2-config on PATH to match, and configure
      # will happily find that one and build libxslt against a library we
      # neither built nor publish. Pointing it at our tree makes it use the
      # xml2-config installed there instead.
      - name: Configure
        run: |
          cd "libxslt-${LIBXSLT_VERSION}"
          ./configure \
              --prefix="${PGBUILD_PREFIX}/libxslt" \
              --with-libxml-prefix="${PGBUILD_PREFIX}/libxml2" \
              --without-python

      - name: Build
        run: |
          cd "libxslt-${LIBXSLT_VERSION}"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Install
        run: |
          cd "libxslt-${LIBXSLT_VERSION}"
          make install

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: libxslt
          install-dir: ${{ env.PGBUILD_PREFIX }}/libxslt

      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/libxslt-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" libxslt

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: libxslt-${{ env.LIBXSLT_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/libxslt-macos-${{ matrix.arch }}-latest.tar.gz

      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: ${{ runner.temp }}/libxslt-macos-${{ matrix.arch }}-latest.tar.gz
          tag: libxslt-macos-${{ matrix.arch }}-latest
          title: libxslt (macOS ${{ matrix.arch }})
          version: ${{ env.LIBXSLT_VERSION }}
          immutable-tag: libxslt-${{ env.LIBXSLT_VERSION }}-macos-${{ matrix.arch }}
          immutable-title: libxslt ${{ env.LIBXSLT_VERSION }} (macOS ${{ matrix.arch }})
