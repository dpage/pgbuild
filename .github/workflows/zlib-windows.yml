name: Build zlib (Windows)

on:
  workflow_dispatch:
  workflow_call:
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-zlib:
    runs-on: windows-latest
    needs: get-versions
    env:
      ZLIB_VERSION: ${{needs.get-versions.outputs.ZLIB_VERSION}}
    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://zlib.net/zlib-${{ env.ZLIB_VERSION }}.tar.gz -o ./zlib-${{ env.ZLIB_VERSION }}.tar.gz
          tar zxvf zlib-${{ env.ZLIB_VERSION }}.tar.gz

      - name: Build
        run: |
          cd zlib-${{ env.ZLIB_VERSION }}
          nmake -f win32/Makefile.msc

      - name: Install
        run: |
          cd zlib-${{ env.ZLIB_VERSION }}

          mkdir \zlib

          mkdir \zlib\bin
          copy zlib1.dll \zlib\bin\
          copy zlib1.pdb \zlib\bin\

          mkdir \zlib\include
          copy zlib.h \zlib\include\
          copy zconf.h \zlib\include\

          mkdir \zlib\lib
          copy zlib.lib \zlib\lib\
          copy zlib.pdb \zlib\lib\
          copy zdll.lib \zlib\lib\
          copy zdll.exp \zlib\lib\

      - name: Create pkgconfig File
        run: |
          mkdir \zlib\lib\pkgconfig

          >> \zlib\lib\pkgconfig\zlib.pc echo prefix=${pcfiledir}/../..
          >> \zlib\lib\pkgconfig\zlib.pc echo exec_prefix=${prefix}
          >> \zlib\lib\pkgconfig\zlib.pc echo libdir=${prefix}/lib
          >> \zlib\lib\pkgconfig\zlib.pc echo includedir=${prefix}/include
          >> \zlib\lib\pkgconfig\zlib.pc echo.
          >> \zlib\lib\pkgconfig\zlib.pc echo Name: zlib
          >> \zlib\lib\pkgconfig\zlib.pc echo Description: zlib compression library
          >> \zlib\lib\pkgconfig\zlib.pc echo Version: ${{ env.ZLIB_VERSION }}
          >> \zlib\lib\pkgconfig\zlib.pc echo Requires:
          >> \zlib\lib\pkgconfig\zlib.pc echo Libs: -L${libdir} -lzdll
          >> \zlib\lib\pkgconfig\zlib.pc echo Cflags: -I${includedir}
        shell: cmd

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: zlib
          install-dir: /zlib

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: zlib-${{ env.ZLIB_VERSION }}-src
          path: zlib-${{ env.ZLIB_VERSION }}.tar.gz

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: zlib-${{ env.ZLIB_VERSION }}-windows-x86_64
          path: /zlib

      - name: Package Release Assets
        shell: pwsh
        run: |
          Compress-Archive /zlib /zlib-windows-x86_64-latest.zip
          
      # The tag is moved rather than the release deleted and remade.
      # Deleting first meant that any failure in the step below, whether
      # permissions, a rate limit or a network blip, left no release at
      # all rather than the previous build: that is how
      # openssl-windows-x86_64-latest came to be absent for four days.
      # action-gh-release updates an existing release in place, so all
      # that is needed is for the rolling tag to point at the commit that
      # produced these assets. Allowed to fail, since the tag will not
      # exist the first time.
      - name: Move the rolling tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/zlib-windows-x86_64-latest" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true

      - name: Create Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "zlib-windows-x86_64-latest"
          target_commitish: ${{ github.sha }}
          name: "zlib (Windows x86_64)"
          prerelease: true
          files: |
            /zlib-windows-x86_64-latest.zip
