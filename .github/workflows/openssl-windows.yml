name: Build OpenSSL (Windows)

on:
  workflow_dispatch:
  workflow_call:
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-openssl:
    needs: get-versions
    runs-on: windows-latest
    env:
      OPENSSL_VERSION:  ${{needs.get-versions.outputs.OPENSSL_VERSION}}
    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz -o ./openssl-${{ env.OPENSSL_VERSION }}.tar.gz
          tar zxvf openssl-${{ env.OPENSSL_VERSION }}.tar.gz

      - name: Configure
        run: |
          cd openssl-${{ env.OPENSSL_VERSION }}
          perl Configure VC-WIN64A no-asm --prefix=\openssl no-ssl3 no-comp

      - name: Build
        run: |
          cd openssl-${{ env.OPENSSL_VERSION }}
          nmake

      - name: Test
        run: |
          cd openssl-${{ env.OPENSSL_VERSION }}
          nmake test

      - name: Install
        run: |
          mkdir \openssl
          cd openssl-${{ env.OPENSSL_VERSION }}
          nmake install

      - name: Create pkgconfig File
        run: |
          mkdir \openssl\lib\pkgconfig

          >> \openssl\lib\pkgconfig\openssl.pc echo prefix=${pcfiledir}/../..
          >> \openssl\lib\pkgconfig\openssl.pc echo exec_prefix=${prefix}
          >> \openssl\lib\pkgconfig\openssl.pc echo libdir=${prefix}/lib
          >> \openssl\lib\pkgconfig\openssl.pc echo includedir=${prefix}/include
          >> \openssl\lib\pkgconfig\openssl.pc echo.
          >> \openssl\lib\pkgconfig\openssl.pc echo Name: openssl
          >> \openssl\lib\pkgconfig\openssl.pc echo Description: openssl encryption library
          >> \openssl\lib\pkgconfig\openssl.pc echo Version: ${{ env.OPENSSL_VERSION }}
          >> \openssl\lib\pkgconfig\openssl.pc echo Libs: -L${libdir} -lcrypto -lssl
          >> \openssl\lib\pkgconfig\openssl.pc echo Cflags: -I${includedir}
        shell: cmd

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: openssl
          install-dir: /openssl

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: openssl-${{ env.OPENSSL_VERSION }}-src
          path: openssl-${{ env.OPENSSL_VERSION }}.tar.gz

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: openssl-${{ env.OPENSSL_VERSION }}-windows-x86_64
          path: /openssl

      - name: Package Release Assets
        shell: pwsh
        run: |
          Compress-Archive /openssl /openssl-windows-x86_64-latest.zip
          
      - name: Publish Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: /openssl-windows-x86_64-latest.zip
          tag: openssl-windows-x86_64-latest
          title: OpenSSL (Windows x86_64)
          version: ${{ env.OPENSSL_VERSION }}
          immutable-tag: openssl-${{ env.OPENSSL_VERSION }}-windows-x86_64
          immutable-title: OpenSSL ${{ env.OPENSSL_VERSION }} (Windows x86_64)
