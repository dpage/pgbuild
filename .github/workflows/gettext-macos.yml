name: Build gettext (macOS)

on:
  workflow_dispatch:
  workflow_call:


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-gettext:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      GETTEXT_VERSION: ${{ needs.get-versions.outputs.GETTEXT_VERSION }}
      LIBICONV_VERSION: ${{ needs.get-versions.outputs.LIBICONV_VERSION }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"
          mkdir -p "${RUNNER_TEMP}/deps"

      # When run via build-all-macos (workflow_call), libiconv is produced
      # earlier in the same run, so this same-run lookup succeeds.
      # continue-on-error lets a standalone dispatch, where no such artifact
      # exists, fall through to the release fallback below instead of failing
      # the job.
      - name: Download libiconv
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: libiconv-${{ env.LIBICONV_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps

      # Anything the step above could not supply is pulled from the rolling
      # per-package release instead, which is what a standalone dispatch of
      # this workflow always ends up doing.
      - name: Download dependencies (release fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tarball="libiconv-macos-${ARCH}-latest.tar.gz"
          if [ ! -f "${RUNNER_TEMP}/deps/${tarball}" ]; then
              echo "Fetching ${tarball} from the libiconv-macos-${ARCH}-latest release"
              gh release download "libiconv-macos-${ARCH}-latest" \
                  --repo "${{ github.repository }}" \
                  --pattern "${tarball}" \
                  --dir "${RUNNER_TEMP}/deps"
          fi

      - name: Install dependencies
        run: |
          tar -xzf "${RUNNER_TEMP}/deps/libiconv-macos-${ARCH}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}"

      - name: Download
        run: |
          # ftp.gnu.org is intermittently unroutable from the runners, so fall
          # back to a mirror rather than failing the entire build.
          for host in https://ftp.gnu.org/pub/gnu https://mirrors.kernel.org/gnu; do
              curl -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                  "${host}/gettext/gettext-${GETTEXT_VERSION}.tar.gz" \
                  -o "gettext-${GETTEXT_VERSION}.tar.gz" && break
          done
          tar zxf "gettext-${GETTEXT_VERSION}.tar.gz"

      # --with-libiconv-prefix points at the GNU libiconv built by
      # libiconv-macos.yml, and is not optional. Left to itself, configure
      # finds the iconv macOS ships in /usr/lib, which is not GNU libiconv,
      # and the build then fails linking libtextstyle with
      # _iconv_ostream_create undefined. The Windows leaf passes the same
      # thing for the same reason; what it also does, and this does not, is
      # patch pthread_sigmask, that being a MinGW fix with no bearing here.
      #
      # Only the shared libraries are wanted, and the Java and C# bindings
      # need toolchains that are neither installed nor worth installing for
      # something PostgreSQL does not link.
      - name: Configure
        run: |
          cd "gettext-${GETTEXT_VERSION}"
          ./configure \
              --prefix="${PGBUILD_PREFIX}/gettext" \
              --with-libiconv-prefix="${PGBUILD_PREFIX}/libiconv" \
              --disable-static \
              --disable-dependency-tracking \
              --enable-silent-rules \
              --disable-csharp \
              --disable-java

      - name: Build
        run: |
          cd "gettext-${GETTEXT_VERSION}"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Install
        run: |
          cd "gettext-${GETTEXT_VERSION}"
          make install

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: gettext
          install-dir: ${{ env.PGBUILD_PREFIX }}/gettext

      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/gettext-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" gettext

          # A checksum beside the archive, in sha256sum's own format so that
          # whoever has downloaded the pair can run `shasum -c` over them
          # unedited, and written from the archive's own directory so that the
          # name recorded in it is the bare file name rather than a path off
          # this runner.
          cd "${RUNNER_TEMP}"
          shasum -a 256 "gettext-macos-${{ matrix.arch }}-latest.tar.gz" \
              > "gettext-macos-${{ matrix.arch }}-latest.tar.gz.sha256"

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: gettext-${{ env.GETTEXT_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/gettext-macos-${{ matrix.arch }}-latest.tar.gz

      # Refreshing a rolling release means replacing its asset, not tearing the
      # release down and building a new one. Creating a release is the
      # expensive operation, and the one that has repeatedly come back as a
      # bare 403 "Resource not accessible by integration" under load, for
      # twenty minutes at a stretch, on a token that the same job had just used
      # to delete a release successfully and that logged Contents: write.
      # Whatever GitHub-side throttle that is, the way not to meet it is not to
      # create a release every night: the tag is created once, and from then on
      # each build moves it to the new commit and clobbers the asset in place.
      # That also keeps the release's identity and URL intact between builds,
      # which deleting and recreating did not.
      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: gettext-macos-${{ matrix.arch }}-latest
          TITLE: gettext (macOS ${{ matrix.arch }})
          ASSET: ${{ runner.temp }}/gettext-macos-${{ matrix.arch }}-latest.tar.gz
          CHECKSUM: ${{ runner.temp }}/gettext-macos-${{ matrix.arch }}-latest.tar.gz.sha256
          VERSION: ${{ env.GETTEXT_VERSION }}
        run: |
          set -euo pipefail

          # Stated on the release itself, so that the version built and the
          # digest published can both be read off the release page: a rolling
          # tag gives a reader nothing else to go on, and downloading the
          # asset in order to find out what it is rather defeats the purpose.
          NOTES="$(printf 'Upstream version: %s\n\n    %s\n' \
              "${VERSION}" "$(cat "${CHECKSUM}")")"

          # True only when the release exists and is not a draft, since a draft
          # has no tag behind it and so cannot be downloaded by tag, however
          # healthy it looks in the web interface.
          is_published() {
              [ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]
          }

          publish() {
              if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      >/dev/null 2>&1; then
                  # Move the rolling tag onto the commit that produced these
                  # assets. Allowed to fail: a release left as a draft by an
                  # earlier attempt has no tag yet, and the edit below makes
                  # one.
                  gh api -X PATCH \
                      "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                      -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 \
                      || true
                  gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --title "${TITLE}" --notes "${NOTES}" \
                      --prerelease --draft=false \
                      >/dev/null &&
                  gh release upload "${TAG}" "${ASSET}" "${CHECKSUM}" \
                      --repo "${GITHUB_REPOSITORY}" --clobber
              else
                  gh release create "${TAG}" "${ASSET}" "${CHECKSUM}" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "${TITLE}" \
                      --notes "${NOTES}" \
                      --prerelease
              fi
          }

          # The back-off is deliberately generous, because throwing away a
          # thirty-minute build that has already passed its tests, over an API
          # call that may well work a few minutes later, would be absurd.
          for attempt in 1 2 3 4 5 6 7 8; do
              if publish && is_published; then
                  echo "Published ${TAG}"
                  exit 0
              fi

              delay=$((attempt * 60))
              if [ "${delay}" -gt 300 ]; then
                  delay=300
              fi
              echo "Publishing ${TAG} failed on attempt ${attempt};" \
                   "retrying in ${delay}s"
              sleep "${delay}"
          done

          echo "Giving up on ${TAG} after 8 attempts" >&2
          exit 1

      # The rolling release above says what is newest; this one says what a
      # given upstream version was. Anything that pins a digest needs the
      # latter, because the -latest asset is clobbered by the next build and
      # the bytes somebody pinned this morning are gone by tomorrow. It is
      # created the first time a version is built and never touched again, so
      # it costs a release creation when the upstream version changes rather
      # than nightly, which is a small fraction of the load the comment above
      # is about.
      - name: Publish Immutable Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: gettext-${{ env.GETTEXT_VERSION }}-macos-${{ matrix.arch }}
          TITLE: gettext ${{ env.GETTEXT_VERSION }} (macOS ${{ matrix.arch }})
          VERSION: ${{ env.GETTEXT_VERSION }}
          ASSET: ${{ runner.temp }}/gettext-macos-${{ matrix.arch }}-latest.tar.gz
        run: |
          set -euo pipefail

          # Immutable means immutable: a rebuild of a version that has already
          # been published is precisely the case this exists for, so nothing
          # is uploaded over it. Should one genuinely need republishing,
          # because the build changed rather than the upstream release, that
          # is a deliberate act rather than something to automate.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                  >/dev/null 2>&1; then
              echo "${TAG} exists already, so this version has been published"
              echo "before and is being left exactly as it is. To republish"
              echo "it, delete that release and its tag by hand, then run this"
              echo "workflow again."
              exit 0
          fi

          # Named after this release's own tag rather than after the rolling
          # one, so that <tag>/<tag>.tar.gz fetches it the way every other
          # archive here is fetched, and so that a copy found on a disk a week
          # later says what it is. The bytes are the rolling release's exactly,
          # so the digest is the same digest; all that differs is the file name
          # recorded beside it, which is the name `shasum -c` goes looking for.
          cd "${RUNNER_TEMP}"
          cp "${ASSET}" "${TAG}.tar.gz"
          shasum -a 256 "${TAG}.tar.gz" > "${TAG}.tar.gz.sha256"

          NOTES="$(printf 'Upstream version: %s\n\n    %s\n' \
              "${VERSION}" "$(cat "${TAG}.tar.gz.sha256")")"

          # The same generous back-off as the rolling release, and for the
          # same reason. Failing here leaves that release alone, since it has
          # already published and nothing in this step touches it.
          for attempt in 1 2 3 4 5 6 7 8; do
              if gh release create "${TAG}" \
                      "${TAG}.tar.gz" "${TAG}.tar.gz.sha256" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "${TITLE}" \
                      --notes "${NOTES}" \
                      --prerelease; then
                  echo "Published ${TAG}"
                  exit 0
              fi

              delay=$((attempt * 60))
              if [ "${delay}" -gt 300 ]; then
                  delay=300
              fi
              echo "Publishing ${TAG} failed on attempt ${attempt};" \
                   "retrying in ${delay}s"
              sleep "${delay}"
          done

          echo "Giving up on ${TAG} after 8 attempts; the rolling release" >&2
          echo "published above is unaffected." >&2
          exit 1
