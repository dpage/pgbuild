name: Build lz4 (Windows)

on:
  workflow_dispatch:
  workflow_call:
    
# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-lz4:
    runs-on: windows-latest
    needs: get-versions
    env:
      LZ4_VERSION: ${{needs.get-versions.outputs.LZ4_VERSION}}
    steps:
      - uses: microsoft/setup-msbuild@v3

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://github.com/lz4/lz4/releases/download/v${{ env.LZ4_VERSION }}/lz4-${{ env.LZ4_VERSION }}.tar.gz -o ./lz4-${{ env.LZ4_VERSION }}.tar.gz
          tar zxvf lz4-${{ env.LZ4_VERSION }}.tar.gz

      - name: Build
        run: |
          cd lz4-${{ env.LZ4_VERSION }}
          msbuild build\VS2022\lz4.sln -target:liblz4-dll /property:Configuration=Release /property:Platform=x64

      - name: Install
        run: |
          cd lz4-${{ env.LZ4_VERSION }}

          mkdir \lz4

          mkdir \lz4\bin
          copy build\VS2022\bin\x64_Release\liblz4.dll /lz4/bin/
          copy build\VS2022\bin\x64_Release\liblz4.pdb /lz4/bin/

          mkdir \lz4\include
          copy lib\*.h \lz4\include\

          mkdir \lz4\lib
          copy build\VS2022\bin\x64_Release\liblz4.lib \lz4\lib\

      - name: Create pkgconfig File
        run: |
          mkdir \lz4\lib\pkgconfig

          >> \lz4\lib\pkgconfig\liblz4.pc echo prefix=${pcfiledir}/../..
          >> \lz4\lib\pkgconfig\liblz4.pc echo exec_prefix=${prefix}
          >> \lz4\lib\pkgconfig\liblz4.pc echo libdir=${prefix}/lib
          >> \lz4\lib\pkgconfig\liblz4.pc echo includedir=${prefix}/include
          >> \lz4\lib\pkgconfig\liblz4.pc echo.
          >> \lz4\lib\pkgconfig\liblz4.pc echo Name: liblz4
          >> \lz4\lib\pkgconfig\liblz4.pc echo Version: ${{ env.LZ4_VERSION }}
          >> \lz4\lib\pkgconfig\liblz4.pc echo Description: lz4 compression library
          >> \lz4\lib\pkgconfig\liblz4.pc echo Libs: -L${libdir} -llz4
          >> \lz4\lib\pkgconfig\liblz4.pc echo Cflags: -I${includedir}
        shell: cmd

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: lz4
          install-dir: /lz4

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: lz4-${{ env.LZ4_VERSION }}-src
          path: lz4-${{ env.LZ4_VERSION }}.tar.gz

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: lz4-${{ env.LZ4_VERSION }}-windows-x86_64
          path: /lz4

      - name: Package Release Assets
        shell: pwsh
        run: |
          Compress-Archive /lz4 /lz4-windows-x86_64-latest.zip
          
      - name: Publish Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: /lz4-windows-x86_64-latest.zip
          tag: lz4-windows-x86_64-latest
          title: lz4 (Windows x86_64)
          version: ${{ env.LZ4_VERSION }}
          immutable-tag: lz4-${{ env.LZ4_VERSION }}-windows-x86_64
          immutable-title: lz4 ${{ env.LZ4_VERSION }} (Windows x86_64)
