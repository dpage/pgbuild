name: Build ossp-uuid (macOS)

on:
  workflow_dispatch:
  workflow_call:


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-ossp-uuid:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      # manifest.yml names this output after the package, giving it a hyphen,
      # which is not legal in a shell variable name, so it is bound to an
      # underscored one for the steps below.
      OSSP_UUID_VERSION: ${{ needs.get-versions.outputs.OSSP-UUID_VERSION }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"

      # From Debian's copy, as OSSP itself is basically unavailable these days;
      # this is the same source the Windows leaf uses.
      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://salsa.debian.org/debian/ossp-uuid/-/archive/upstream/${OSSP_UUID_VERSION}/ossp-uuid-upstream-${OSSP_UUID_VERSION}.tar.gz" \
              -o "ossp-uuid-upstream-${OSSP_UUID_VERSION}.tar.gz"
          tar zxf "ossp-uuid-upstream-${OSSP_UUID_VERSION}.tar.gz"

      # The config.guess in this tree dates from 2008 and reports
      # arm-apple-darwin on Apple silicon, which the config.sub beside it
      # accepts, so it is left to get on with it. Overriding --build with the
      # machine's real architecture would hand that config.sub an arm64 it has
      # never heard of, and configure would stop there.
      - name: Configure
        run: |
          cd "ossp-uuid-upstream-${OSSP_UUID_VERSION}"
          ./configure --prefix="${PGBUILD_PREFIX}/ossp-uuid"

      # Serially: the makefile is of the same vintage as the rest of the tree,
      # and the build is small enough that parallelism would buy nothing.
      - name: Build
        run: |
          cd "ossp-uuid-upstream-${OSSP_UUID_VERSION}"
          make all

      # The Windows leaf installs by hand and writes its own pkg-config file,
      # because .exe extensions defeat the install rules there. Neither is
      # needed here: make install works, and brings the uuid.pc and
      # uuid-config that upstream ships with it.
      - name: Install
        run: |
          cd "ossp-uuid-upstream-${OSSP_UUID_VERSION}"
          make install

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: ossp-uuid
          install-dir: ${{ env.PGBUILD_PREFIX }}/ossp-uuid

      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/ossp-uuid-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" ossp-uuid

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ossp-uuid-${{ env.OSSP_UUID_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/ossp-uuid-macos-${{ matrix.arch }}-latest.tar.gz

      # Refreshing a rolling release means replacing its asset, not tearing the
      # release down and building a new one. Creating a release is the
      # expensive operation, and the one that has repeatedly come back as a
      # bare 403 "Resource not accessible by integration" under load, for
      # twenty minutes at a stretch, on a token that the same job had just used
      # to delete a release successfully and that logged Contents: write.
      # Whatever GitHub-side throttle that is, the way not to meet it is not to
      # create a release every night: the tag is created once, and from then on
      # each build moves it to the new commit and clobbers the asset in place.
      # That also keeps the release's identity and URL intact between builds,
      # which deleting and recreating did not.
      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ossp-uuid-macos-${{ matrix.arch }}-latest
          TITLE: ossp-uuid (macOS ${{ matrix.arch }})
          ASSET: ${{ runner.temp }}/ossp-uuid-macos-${{ matrix.arch }}-latest.tar.gz
        run: |
          set -euo pipefail

          # True only when the release exists and is not a draft, since a draft
          # has no tag behind it and so cannot be downloaded by tag, however
          # healthy it looks in the web interface.
          is_published() {
              [ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]
          }

          publish() {
              if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      >/dev/null 2>&1; then
                  # Move the rolling tag onto the commit that produced these
                  # assets. Allowed to fail: a release left as a draft by an
                  # earlier attempt has no tag yet, and the edit below makes
                  # one.
                  gh api -X PATCH \
                      "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                      -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 \
                      || true
                  gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --title "${TITLE}" --prerelease --draft=false \
                      >/dev/null &&
                  gh release upload "${TAG}" "${ASSET}" \
                      --repo "${GITHUB_REPOSITORY}" --clobber
              else
                  gh release create "${TAG}" "${ASSET}" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "${TITLE}" \
                      --prerelease
              fi
          }

          # The back-off is deliberately generous, because throwing away a
          # thirty-minute build that has already passed its tests, over an API
          # call that may well work a few minutes later, would be absurd.
          for attempt in 1 2 3 4 5 6 7 8; do
              if publish && is_published; then
                  echo "Published ${TAG}"
                  exit 0
              fi

              delay=$((attempt * 60))
              if [ "${delay}" -gt 300 ]; then
                  delay=300
              fi
              echo "Publishing ${TAG} failed on attempt ${attempt};" \
                   "retrying in ${delay}s"
              sleep "${delay}"
          done

          echo "Giving up on ${TAG} after 8 attempts" >&2
          exit 1
