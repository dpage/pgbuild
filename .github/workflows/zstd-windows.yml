name: Build zstd (Windows)

on:
  workflow_dispatch:
  workflow_call:
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-zstd:
    runs-on: windows-latest
    needs: get-versions
    env:
      ZSTD_VERSION: ${{needs.get-versions.outputs.ZSTD_VERSION}}
    steps:
      - uses: microsoft/setup-msbuild@v3
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://github.com/facebook/zstd/releases/download/v${{ env.ZSTD_VERSION }}/zstd-${{ env.ZSTD_VERSION }}.tar.gz -o ./zstd-${{ env.ZSTD_VERSION }}.tar.gz
          tar zxvf zstd-${{ env.ZSTD_VERSION }}.tar.gz

      - name: Configure
        run: |
          cd zstd-${{ env.ZSTD_VERSION }}
          devenv.com /upgrade build\VS2010\zstd.sln

      - name: Build
        run: |
          cd zstd-${{ env.ZSTD_VERSION }}
          msbuild build\VS2010\zstd.sln -target:libzstd-dll /property:Configuration=Release /property:Platform=x64

      - name: Install
        run: |
          cd zstd-${{ env.ZSTD_VERSION }}

          mkdir \zstd

          mkdir \zstd\bin
          copy build\VS2010\bin\x64_Release\libzstd.dll \zstd\bin\
          copy build\VS2010\bin\x64_Release\libzstd.pdb \zstd\bin\

          mkdir \zstd\include
          copy lib\*.h \zstd\include\

          mkdir \zstd\lib
          copy build\VS2010\bin\x64_Release\libzstd.lib \zstd\lib\

      - name: Create pkgconfig File
        run: |
          mkdir \zstd\lib\pkgconfig

          >> \zstd\lib\pkgconfig\libzstd.pc echo prefix=${pcfiledir}/../..
          >> \zstd\lib\pkgconfig\libzstd.pc echo exec_prefix=${prefix}
          >> \zstd\lib\pkgconfig\libzstd.pc echo libdir=${prefix}/lib
          >> \zstd\lib\pkgconfig\libzstd.pc echo includedir=${prefix}/include
          >> \zstd\lib\pkgconfig\libzstd.pc echo.
          >> \zstd\lib\pkgconfig\libzstd.pc echo Name: zstd
          >> \zstd\lib\pkgconfig\libzstd.pc echo Description: fast lossless compression algorithm library
          >> \zstd\lib\pkgconfig\libzstd.pc echo URL: https://facebook.github.io/zstd/
          >> \zstd\lib\pkgconfig\libzstd.pc echo Version: ${{ env.ZSTD_VERSION }}
          >> \zstd\lib\pkgconfig\libzstd.pc echo Libs: -L${libdir} -lzstd
          >> \zstd\lib\pkgconfig\libzstd.pc echo Libs.private:
          >> \zstd\lib\pkgconfig\libzstd.pc echo Cflags: -I${includedir}
        shell: cmd

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: zstd
          install-dir: /zstd

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: zstd-${{ env.ZSTD_VERSION }}-src
          path: zstd-${{ env.ZSTD_VERSION }}.tar.gz

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: zstd-${{ env.ZSTD_VERSION }}-windows-x86_64
          path: /zstd

      - name: Package Release Assets
        shell: pwsh
        run: |
          Compress-Archive /zstd /zstd-windows-x86_64-latest.zip
          
      # The tag is moved rather than the release deleted and remade.
      # Deleting first meant that any failure in the step below, whether
      # permissions, a rate limit or a network blip, left no release at
      # all rather than the previous build: that is how
      # openssl-windows-x86_64-latest came to be absent for four days.
      # action-gh-release updates an existing release in place, so all
      # that is needed is for the rolling tag to point at the commit that
      # produced these assets. Allowed to fail, since the tag will not
      # exist the first time.
      - name: Move the rolling tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/zstd-windows-x86_64-latest" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true

      - name: Create Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "zstd-windows-x86_64-latest"
          target_commitish: ${{ github.sha }}
          name: "zstd (Windows x86_64)"
          prerelease: true
          files: |
            /zstd-windows-x86_64-latest.zip
