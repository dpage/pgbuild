name: Build zstd (macOS)

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # pgAdmin supports macOS 14 (Sonoma) and above; see openssl-macos.yml for
  # why this is pinned rather than inherited from the runner's SDK.
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Reserve space in the Mach-O headers for longer install names than the
  # ones linked in. Consumers relocate these libraries into their own bundles
  # and rewrite the references with install_name_tool, and an @loader_path
  # path is longer than the /opt/pgbuild one it replaces. Without the padding
  # the rewrite fails outright with "larger updated load commands do not fit",
  # which is what happened to pg_restore in pgAdmin's appbundle build.
  LDFLAGS: '-Wl,-headerpad_max_install_names'
  PGBUILD_PREFIX: /opt/pgbuild

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-zstd:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    env:
      ZSTD_VERSION: ${{ needs.get-versions.outputs.ZSTD_VERSION }}

    steps:
      - name: Prepare install prefix
        run: |
          sudo mkdir -p "${PGBUILD_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${PGBUILD_PREFIX}"

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
              "https://github.com/facebook/zstd/releases/download/v${ZSTD_VERSION}/zstd-${ZSTD_VERSION}.tar.gz" \
              -o "zstd-${ZSTD_VERSION}.tar.gz"
          tar zxf "zstd-${ZSTD_VERSION}.tar.gz"

      # prefix has to be given to the build and not just to the install. zstd
      # derives the dylib's -install_name from LIBDIR, which defaults to
      # $(prefix)/lib with prefix defaulting to /usr/local, and that name is
      # baked in when the library is linked. Passing prefix only to `make
      # install` therefore produces a correctly placed libzstd that still
      # announces itself as /usr/local/lib/libzstd.1.dylib, which is both
      # missing on the target machine and, on an Intel Mac with Homebrew, an
      # invitation to load somebody else's zstd instead.
      - name: Build
        run: |
          cd "zstd-${ZSTD_VERSION}"
          make -j"$(sysctl -n hw.ncpu)" prefix="${PGBUILD_PREFIX}/zstd"

      - name: Install
        run: |
          cd "zstd-${ZSTD_VERSION}"
          make install prefix="${PGBUILD_PREFIX}/zstd"

      - name: Checkout local actions
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx-posix
            .github/actions/publish-release
          sparse-checkout-cone-mode: false

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx-posix
        with:
          package: zstd
          install-dir: ${{ env.PGBUILD_PREFIX }}/zstd

      - name: Package
        run: |
          tar -czf "${RUNNER_TEMP}/zstd-macos-${{ matrix.arch }}-latest.tar.gz" \
              -C "${PGBUILD_PREFIX}" zstd

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: zstd-${{ env.ZSTD_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/zstd-macos-${{ matrix.arch }}-latest.tar.gz

      - name: Publish Release
        # Only from the default branch. A build on a working branch is a
        # test of the build, and the rolling tags are shared: publishing
        # from a branch overwrites whatever main last produced, and main's
        # next scheduled run overwrites that in turn, so whichever ran last
        # decides what everybody downloads.
        if: github.ref == 'refs/heads/main'
        uses: ./_src/.github/actions/publish-release
        with:
          asset: ${{ runner.temp }}/zstd-macos-${{ matrix.arch }}-latest.tar.gz
          tag: zstd-macos-${{ matrix.arch }}-latest
          title: zstd (macOS ${{ matrix.arch }})
          version: ${{ env.ZSTD_VERSION }}
          immutable-tag: zstd-${{ env.ZSTD_VERSION }}-macos-${{ matrix.arch }}
          immutable-title: zstd ${{ env.ZSTD_VERSION }} (macOS ${{ matrix.arch }})
