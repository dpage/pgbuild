name: Build PostgreSQL (Windows)

on:
  workflow_dispatch:
  workflow_call:
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Declared rather than inherited. A called workflow runs with the CALLER's
# permissions, and a push-triggered run does not get the same default token
# as a scheduled or dispatched one: every push-triggered run of this
# orchestrator failed at Create Release with 403 whilst every scheduled one
# succeeded, and because the Windows leaves delete before they create, each
# failure left no release at all until the next schedule repaired it.
permissions:
  contents: write

jobs:
  get-versions:
    uses: ./.github/workflows/manifest.yml
    with:
      config-path: manifest.json

  build-postgresql:
    needs: get-versions

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.get-versions.outputs.POSTGRESQL_VERSION) }}

    runs-on: windows-latest

    # -m enables parallelism
    # verbosity:minimal + Summary reduce verbosity, while keeping a summary of
    #   errors/warnings
    # ForceNoAlign prevents msbuild from introducing line-breaks for long lines
    # disable file tracker, we're never going to rebuild, and it slows down the
    #   build
    env:
      MSBFLAGS: -m -verbosity:minimal "-consoleLoggerParameters:Summary;ForceNoAlign" /p:TrackFileAccess=false -nologo
      POSTGRESQL_VERSIONS: ${{needs.get-versions.outputs.POSTGRESQL_VERSION}}
    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      # When run via build-all (workflow_call), the all-deps-windows-x86_64 artifact is
      # produced by the bundle-deps job earlier in the same run, so this
      # same-run lookup succeeds. continue-on-error lets a standalone dispatch
      # (where no such artifact exists) fall through to the release fallback
      # below instead of failing the job.
      - name: Download dependencies
        id: download-deps
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: all-deps-windows-x86_64
          path: /builddeps

      # Standalone dispatch has no same-run artifact; pull the dependencies
      # from the dependencies-windows-x86_64-latest release published by bundle-deps. The
      # release archive has a top-level builddeps/ directory, so extracting to
      # the filesystem root reproduces the \builddeps layout. Skipped on
      # build-all runs, where the step above already succeeded.
      - name: Download dependencies (release fallback)
        if: steps.download-deps.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download dependencies-windows-x86_64-latest `
              --repo ${{ github.repository }} `
              --pattern postgresql-dependencies-windows-x86_64-latest.zip `
              --dir $env:RUNNER_TEMP
          Expand-Archive `
              -Path $env:RUNNER_TEMP\postgresql-dependencies-windows-x86_64-latest.zip `
              -DestinationPath \ -Force

      # Copy libraries requires at runtime to installation directory.
      #
      # Do so before configuring / building postgres, otherwise we need to
      # duplicate knowledge about aberrant paths like "bin64".
      - name: Install Dependencies
        run: |
          mkdir \postgresql
          mkdir \postgresql\bin

          copy \builddeps\bin64\icuuc*.dll \postgresql\bin\
          copy \builddeps\bin64\icudt*.dll \postgresql\bin\
          copy \builddeps\bin64\icuin*.dll \postgresql\bin\
          copy \builddeps\bin\libiconv-2.dll \postgresql\bin\
          copy \builddeps\bin\libintl-8.dll \postgresql\bin\
          copy \builddeps\bin\libxml2.dll \postgresql\bin\
          copy \builddeps\bin\libxslt.dll \postgresql\bin\
          copy \builddeps\bin\libssl-*-x64.dll \postgresql\bin\
          copy \builddeps\bin\libcrypto-*-x64.dll \postgresql\bin\
          copy \builddeps\bin\liblz4.dll \postgresql\bin\
          copy \builddeps\bin\libzstd.dll \postgresql\bin\
          copy \builddeps\bin\zlib1.dll \postgresql\bin\

      # GSSAPI (MIT Kerberos) is only enabled for PG18+ (see the meson
      # Configure step), so only those builds need the krb5 runtime DLLs that
      # libpq's gssapi support links against.
      - name: Install GSSAPI runtime dependencies
        run: |
          copy \builddeps\bin\gssapi64.dll \postgresql\bin\
          copy \builddeps\bin\krb5_64.dll \postgresql\bin\
          copy \builddeps\bin\comerr64.dll \postgresql\bin\
          copy \builddeps\bin\k5sprt64.dll \postgresql\bin\
          copy \builddeps\bin\xpprof64.dll \postgresql\bin\
          copy \builddeps\bin\krbcc64.dll \postgresql\bin\
        shell: cmd
        if: ${{ fromJson(matrix.version) >= 18.0 }}

      - name: Add build deps to path
        run: |
          # so binaries and libraries can be found/run
          echo "/builddeps/bin" >> $ENV:GITHUB_PATH
          echo "/builddeps" >> $ENV:GITHUB_PATH
          echo "/postgresql/bin" >> $ENV:GITHUB_PATH

      # This is run as a privileged user. For some reason windows ends up
      # creating the directories owned by "Administrator", which causes
      # problems because when postgres drops privileges, it doesn't have
      # sufficient rights to access them anymore!
      #
      # I have pulled most of my hair out over the last hours.
      #
      # See also https://www.postgresql.org/message-id/20240707064046.blgjxoqiywunbebl%40awork3.anarazel.de
      - name: Work around privilege issue
        run: |
          icacls.exe . /inheritance:e /grant 'runneradmin:(OI)(CI)F'

      - name: Download
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://ftp.postgresql.org/pub/source/v${{ matrix.version }}/postgresql-${{ matrix.version }}.tar.gz -o ./postgresql-${{ matrix.version }}.tar.gz
          tar zxvf postgresql-${{ matrix.version }}.tar.gz

      - name: Configure (msvc)
        run: |
          cd postgresql-${{ matrix.version }}\src\tools\msvc

          >> config.pl echo # Configuration arguments for vcbuild.
          >> config.pl echo use strict;
          >> config.pl echo use warnings;
          >> config.pl echo.
          >> config.pl echo our $config = {
          >> config.pl echo 	asserts   =^> 0,        # --enable-cassert
          >> config.pl echo 	ldap      =^> 1,        # --with-ldap
          >> config.pl echo 	extraver  =^> undef,    # --with-extra-version=^<string^>
          >> config.pl echo 	gss       =^> undef,    # --with-gssapi=^<path^>
          >> config.pl echo 	icu       =^> '\builddeps',    # --with-icu=^<path^>
          >> config.pl echo 	lz4       =^> '\builddeps',    # --with-lz4=^<path^>
          >> config.pl echo 	zstd      =^> '\builddeps',    # --with-zstd=^<path^>
          >> config.pl echo 	nls       =^> '\builddeps',    # --enable-nls=^<path^>
          >> config.pl echo 	tap_tests =^> 1,    # --enable-tap-tests
          >> config.pl echo 	tcl       =^> undef,    # --with-tcl=^<path^>
          >> config.pl echo 	perl      =^> undef,    # --with-perl
          >> config.pl echo 	python    =^> undef,    # --with-python=^<path^>
          >> config.pl echo 	openssl   =^> '\builddeps',    # --with-openssl=^<path^>
          >> config.pl echo 	uuid      =^> '\builddeps',    # --with-ossp-uuid
          >> config.pl echo 	xml       =^> '\builddeps',    # --with-libxml=^<path^>
          >> config.pl echo 	xslt      =^> '\builddeps',    # --with-libxslt=^<path^>
          >> config.pl echo 	iconv     =^> '\builddeps',    # (not in configure, path to iconv)
          >> config.pl echo 	zlib      =^> '\builddeps'     # --with-zlib=^<path^>
          >> config.pl echo };
          >> config.pl echo.
          >> config.pl echo 1;
        shell: cmd
        if: ${{ fromJson(matrix.version) < 17.0 }}

      - name: Configure (meson)
        run: |
          # Optimize path length for Meson 1.9.1+ to avoid Windows 32KB PATH limit
          # Move to short root path: \s\pg\b instead of long GitHub Actions path
          # This saves ~40 chars per path = ~8KB total with 200+ test directories
          New-Item -ItemType Directory -Force -Path \s
          Move-Item postgresql-${{ matrix.version }} \s\pg

          # Resolve builddeps path
          $deps = resolve-path /builddeps

          # Change to source directory
          cd \s\pg

          # GSSAPI (MIT Kerberos) can only be enabled on PG18+. The Windows
          # build of libpq with both OpenSSL and GSSAPI enabled fails to
          # compile on older branches because <wincrypt.h> #defines X509_NAME,
          # clobbering OpenSSL's typedef. That was fixed upstream by the commit
          # adding src/include/libpq/pg-gssapi.h, which is present in PG18 and
          # master but was not back-patched to 17 or earlier.
          $pgMajor = [int]( '${{ matrix.version }}'.Split('.')[0] )
          $gssapi = if ($pgMajor -ge 18) { 'enabled' } else { 'disabled' }

          # can't enable some extra tests
          # - libpq_encryption -> fails for unknown reasons
          # - kerberos -> test not yet supported on windows
          # - load_balance -> would need to set up hostnames
          meson setup `
              --prefix=\postgresql `
              "--cmake-prefix-path=${deps}" `
              "--pkg-config-path=${deps}\lib\pkgconfig" `
              "-Dextra_include_dirs=${deps}\include" `
              "-Dextra_lib_dirs=${deps}\lib,${deps}\lib\amd64" `
              "-DPG_TEST_EXTRA=ldap ssl" `
              -Duuid=ossp `
              -Db_pch=true `
              "-Dgssapi=$gssapi" `
              -Dbuildtype=debugoptimized `
              b
        if: ${{ fromJson(matrix.version) >= 17.0 }}

      - name: Build (msvc)
        run: |
          cd postgresql-${{ matrix.version }}\src\tools\msvc
          build
        shell: cmd
        if: ${{ fromJson(matrix.version) < 17.0 }}

      - name: Build (meson)
        run: |
          cd \s\pg\b
          ninja -j 1
        if: ${{ fromJson(matrix.version) >= 17.0 }}

      - name: Test (msvc)
        run: |
          cd postgresql-${{ matrix.version }}\src\tools\msvc
          vcregress check
        shell: cmd
        if: ${{ fromJson(matrix.version) < 17.0 }}

      - name: Test (meson) - core
        run: |
          cd \s\pg\b

          # use unix socket to prevent port conflicts
          $env:PG_TEST_USE_UNIX_SOCKETS = 1;
          # otherwise pg_regress insists on creating the directory and does it
          # in a non-existing place, this needs to be fixed :(
          mkdir d:/sockets
          $env:PG_REGRESS_SOCK_DIR = "d:/sockets/"

          meson test --suite setup --suite recovery --suite subscription
        if: ${{ fromJson(matrix.version) >= 17.0 }}

      - name: Test (meson) - ecpg
        run: |
          cd \s\pg\b

          $env:PG_TEST_USE_UNIX_SOCKETS = 1;
          $env:PG_REGRESS_SOCK_DIR = "d:/sockets/"

          meson test --suite ecpg
        if: ${{ fromJson(matrix.version) >= 17.0 }}

      - name: Test (meson) - tools
        run: |
          cd \s\pg\b

          $env:PG_TEST_USE_UNIX_SOCKETS = 1;
          $env:PG_REGRESS_SOCK_DIR = "d:/sockets/"

          meson test --no-rebuild --suite scripts --suite pg_verifybackup --suite pg_rewind --suite pg_combinebackup --suite pg_upgrade --suite amcheck --suite pg_amcheck --suite pg_basebackup --suite pg_dump --suite authentication --suite libpq --suite commit_ts --suite pg_ctl --suite test_misc
        if: ${{ fromJson(matrix.version) >= 17.0 }}

      - name: Test (meson) - contrib & extensions
        run: |
          cd \s\pg\b

          $env:PG_TEST_USE_UNIX_SOCKETS = 1;
          $env:PG_REGRESS_SOCK_DIR = "d:/sockets/"

          meson test --no-rebuild --no-suite setup --no-suite recovery --no-suite subscription --no-suite ecpg --no-suite scripts --no-suite pg_verifybackup --no-suite pg_rewind --no-suite pg_combinebackup --no-suite pg_upgrade --no-suite amcheck --no-suite pg_amcheck --no-suite pg_basebackup --no-suite pg_dump --no-suite authentication --no-suite libpq --no-suite commit_ts --no-suite pg_ctl --no-suite test_misc
        if: ${{ fromJson(matrix.version) >= 17.0 }}

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: postgresql-${{ matrix.version }}-test-logs
          path: |
            \s\pg\b\testrun\**\*.log
            \s\pg\b\testrun\**\regress_log_*
            \s\pg\b\testrun\**\*.diffs
            \s\pg\b\testrun\**\*.out
            \s\pg\b\meson-logs\testlog.txt
        if: always()

      - name: Install (msvc)
        run: |
          cd postgresql-${{ matrix.version }}\src\tools\msvc

          perl install.pl \postgresql
        shell: cmd
        if: ${{ fromJson(matrix.version) < 17.0 }}

      - name: Install (meson)
        run: |
          cd \s\pg\b

          meson install --quiet
        if: ${{ fromJson(matrix.version) >= 17.0 }}

      - name: Checkout SPDX action
        uses: actions/checkout@v6
        with:
          path: _src
          sparse-checkout: |
            .github/actions/generate-spdx
          sparse-checkout-cone-mode: false

      - name: Copy dependency SPDX manifests
        shell: pwsh
        run: |
          if (Test-Path /builddeps/MANIFESTS) {
            New-Item -ItemType Directory -Path /postgresql/MANIFESTS -Force | Out-Null
            Copy-Item /builddeps/MANIFESTS/*.spdx.json /postgresql/MANIFESTS/
          }

      - name: Generate SPDX manifest
        uses: ./_src/.github/actions/generate-spdx
        with:
          package: postgresql
          install-dir: /postgresql
          version: ${{ matrix.version }}

      - name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: postgresql-${{ matrix.version }}-src
          path: postgresql-${{ matrix.version }}.tar.gz

      - name: Upload Config
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: postgresql-${{ matrix.version }}-config
          path: |
            postgresql-${{ matrix.version }}/src/tools/msvc/config.pl
            postgresql-${{ matrix.version }}/src/tools/msvc/buildenv.pl
        if: ${{ fromJson(matrix.version) < 17.0 }}

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: postgresql-${{ matrix.version }}-windows-x86_64
          path: /postgresql

      - name: Upload Meson Log
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: postgresql-${{ matrix.version }}-meson-log
          path: \s\pg\b\meson-logs\meson-log.txt
        if: always()

      - name: Package Release Assets
        shell: pwsh
        id: majorVersion
        run: |
          $major_ver = '${{ matrix.version }}' -split '\.' | select-object -index 0
          Compress-Archive /postgresql /postgresql-$($major_ver)-windows-x86_64-latest.zip
          Write-Output "majorVersion=$($major_ver)" >> $Env:GITHUB_OUTPUT
          
      # A checksum beside the archive, in sha256sum's own format, which is the
      # digest and two spaces and the bare file name, so that whoever has
      # downloaded the pair can run `shasum -c` over them unedited. It is
      # written with an explicit LF rather than the CRLF PowerShell would
      # otherwise leave, because the carriage return would end up as part of
      # the name shasum then went looking for.
      - name: Checksum Release Assets
        id: checksum
        shell: pwsh
        run: |
          $archive = '/postgresql-${{ steps.majorVersion.outputs.majorVersion}}-windows-x86_64-latest.zip'
          $name = Split-Path -Leaf $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          Set-Content -Path "$archive.sha256" -Value "$hash  $name`n" -NoNewline
          Write-Output "sha256=$hash" >> $Env:GITHUB_OUTPUT

      # The tag is moved rather than the release deleted and remade.
      # Deleting first meant that any failure in the step below, whether
      # permissions, a rate limit or a network blip, left no release at
      # all rather than the previous build: that is how
      # openssl-windows-x86_64-latest came to be absent for four days.
      # action-gh-release updates an existing release in place, so all
      # that is needed is for the rolling tag to point at the commit that
      # produced these assets. Allowed to fail, since the tag will not
      # exist the first time.
      - name: Move the rolling tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/postgresql-${{ steps.majorVersion.outputs.majorVersion}}-windows-x86_64-latest" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true

      - name: Create Release
        # Only from the default branch; see the macOS leaves for why.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "postgresql-${{ steps.majorVersion.outputs.majorVersion}}-windows-x86_64-latest"
          target_commitish: ${{ github.sha }}
          name: "PostgreSQL ${{ steps.majorVersion.outputs.majorVersion}} (Windows x86_64)"
          prerelease: true
          body: |
            Upstream version: ${{ matrix.version }}

                ${{ steps.checksum.outputs.sha256 }}  postgresql-${{ steps.majorVersion.outputs.majorVersion}}-windows-x86_64-latest.zip
          files: |
            /postgresql-${{ steps.majorVersion.outputs.majorVersion}}-windows-x86_64-latest.zip
            /postgresql-${{ steps.majorVersion.outputs.majorVersion}}-windows-x86_64-latest.zip.sha256

      # The rolling release above says what is newest; this one says what a
      # given upstream version was. Anything that pins a digest needs the
      # latter, because the -latest asset is clobbered by the next build and
      # the bytes somebody pinned this morning are gone by tomorrow. It is
      # created the first time a version is built and never touched again, so
      # it costs a release creation when the upstream version changes rather
      # than nightly, which is a small fraction of the load the macOS leaves
      # warn about.
      - name: Prepare the Immutable Release
        if: github.ref == 'refs/heads/main'
        id: immutable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An absent release is the ordinary case here rather than an error,
          # so the pwsh default of turning a non-zero exit from a native
          # command into a terminating one has to be out of the way.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = 'postgresql-${{ matrix.version }}-windows-x86_64'
          gh release view $tag --repo $Env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              # Immutable means immutable: a rebuild of a version that has
              # already been published is precisely the case this exists for,
              # so nothing is uploaded over it.
              Write-Output "$tag exists already, so this version has been"
              Write-Output "published before and is being left exactly as"
              Write-Output "it is. To republish it, because the build"
              Write-Output "changed rather than the upstream release,"
              Write-Output "delete that release and its tag by hand, then"
              Write-Output "run this workflow again."
              Write-Output "publish=false" >> $Env:GITHUB_OUTPUT
              exit 0
          }

          # Named after this release's own tag rather than after the rolling
          # one, so that <tag>/<tag>.zip fetches it the way every other archive
          # here is fetched, and so that a copy found on a disk a week later
          # says what it is. The bytes are the rolling release's exactly, so
          # the digest is the same digest; all that differs is the file name
          # recorded beside it, which is the name `shasum -c` goes looking for.
          $copy = "/$tag.zip"
          Copy-Item -LiteralPath '/postgresql-${{ steps.majorVersion.outputs.majorVersion}}-windows-x86_64-latest.zip' -Destination $copy -Force
          $hash = (Get-FileHash -Algorithm SHA256 $copy).Hash.ToLower()
          Set-Content -Path "$copy.sha256" -Value "$hash  $tag.zip`n" -NoNewline
          Write-Output "sha256=$hash" >> $Env:GITHUB_OUTPUT
          Write-Output "publish=true" >> $Env:GITHUB_OUTPUT
          exit 0

      - name: Create Immutable Release
        if: github.ref == 'refs/heads/main' && steps.immutable.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "postgresql-${{ matrix.version }}-windows-x86_64"
          target_commitish: ${{ github.sha }}
          name: "PostgreSQL ${{ matrix.version }} (Windows x86_64)"
          prerelease: true
          body: |
            Upstream version: ${{ matrix.version }}

                ${{ steps.immutable.outputs.sha256 }}  postgresql-${{ matrix.version }}-windows-x86_64.zip
          files: |
            /postgresql-${{ matrix.version }}-windows-x86_64.zip
            /postgresql-${{ matrix.version }}-windows-x86_64.zip.sha256
